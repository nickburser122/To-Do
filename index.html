:root{
  --bg: #F7F5F1;
  --bg-raised: #FFFFFF;
  --surface-2: #FBFAF7;
  --surface-sunken: #F1EEE9;
  --ink: #1C1A18;
  --ink-soft: #6B655E;
  --ink-faint: #A29B93;
  --hairline: rgba(28,26,24,.075);
  --hairline-strong: rgba(28,26,24,.12);
  --line: var(--hairline);
  --line-soft: var(--surface-2);
  --accent: #9A5B4C;
  --accent-ink: #844B3E;
  --accent-soft: #F4EAE5;
  --accent-ring: rgba(154,91,76,.28);
  --brass: #5B7C99;
  --brass-ink: #3F5A73;
  --brass-soft: #E7EEF3;
  --danger: #AF4A42;
  --danger-soft: #F8E9E7;
  --warn: #5B7C99;
  --warn-soft: #E7EEF3;
  --ok: #5E7D63;
  --ok-soft: #E9F0EA;
  --slate: #5F6E78;
  --slate-soft: #EBEFF1;
  --radius-xs: 8px;
  --radius-sm: 12px;
  --radius: 16px;
  --radius-lg: 22px;
  --shadow-sm: 0 0 0 0.5px var(--hairline), 0 1px 2px rgba(28,26,24,.04);
  --shadow-raised: 0 0 0 0.5px var(--hairline), 0 6px 20px rgba(28,26,24,.07);
  --shadow-md: 0 24px 64px rgba(28,26,24,.18);
  --ease-out: cubic-bezier(.32,.72,0,1);
  --font-ui: -apple-system, BlinkMacSystemFont, "SF Pro Text", "SF Arabic", "IBM Plex Sans Arabic", "Segoe UI", system-ui, sans-serif;
  --font-mono-sys: ui-monospace, SFMono-Regular, Menlo, Consolas, monospace;
  --safe-t: env(safe-area-inset-top, 0px);
  --safe-b: env(safe-area-inset-bottom, 0px);
  --safe-l: env(safe-area-inset-left, 0px);
  --safe-r: env(safe-area-inset-right, 0px);
}
@media (prefers-color-scheme: dark){
  :root:not([data-theme="light"]){
    --bg: #121110; --bg-raised: #1B1A18; --surface-2: #222120; --surface-sunken: #0E0D0C;
    --hairline: rgba(255,255,255,.08); --hairline-strong: rgba(255,255,255,.14);
    --ink: #F3F0EB; --ink-soft: #A8A29A; --ink-faint: #726C65;
    --accent: #C4826F; --accent-ink: #D49781; --accent-soft: rgba(196,130,111,.16); --accent-ring: rgba(196,130,111,.35);
    --danger: #D2716A; --danger-soft: rgba(210,113,106,.16);
    --ok: #8AA98F; --ok-soft: rgba(138,169,143,.16);
    --brass: #7FA0BE; --warn: #7FA0BE; --brass-soft: rgba(127,160,190,.16); --warn-soft: rgba(127,160,190,.16);
    --slate: #8A9AA5; --slate-soft: rgba(138,154,165,.14);
    --shadow-sm: 0 0 0 0.5px var(--hairline), 0 1px 2px rgba(0,0,0,.2);
    --shadow-raised: 0 0 0 0.5px var(--hairline), 0 6px 20px rgba(0,0,0,.35);
    --shadow-md: 0 24px 64px rgba(0,0,0,.5);
  }
}
:root[data-theme="dark"]{
  --bg: #121110; --bg-raised: #1B1A18; --surface-2: #222120; --surface-sunken: #0E0D0C;
  --hairline: rgba(255,255,255,.08); --hairline-strong: rgba(255,255,255,.14);
  --ink: #F3F0EB; --ink-soft: #A8A29A; --ink-faint: #726C65;
  --accent: #C4826F; --accent-ink: #D49781; --accent-soft: rgba(196,130,111,.16); --accent-ring: rgba(196,130,111,.35);
  --danger: #D2716A; --danger-soft: rgba(210,113,106,.16);
  --ok: #8AA98F; --ok-soft: rgba(138,169,143,.16);
  --brass: #7FA0BE; --warn: #7FA0BE; --brass-soft: rgba(127,160,190,.16); --warn-soft: rgba(127,160,190,.16);
  --slate: #8A9AA5; --slate-soft: rgba(138,154,165,.14);
  --shadow-sm: 0 0 0 0.5px var(--hairline), 0 1px 2px rgba(0,0,0,.2);
  --shadow-raised: 0 0 0 0.5px var(--hairline), 0 6px 20px rgba(0,0,0,.35);
  --shadow-md: 0 24px 64px rgba(0,0,0,.5);
}
body{ transition: background-color .18s var(--ease-out), color .18s var(--ease-out); }
*{ box-sizing: border-box; }
html,body{ height:100%; }
body{
  margin:0; background:var(--bg); color:var(--ink); font-family:var(--font-ui);
  font-size:14px; line-height:1.45; -webkit-font-smoothing:antialiased; position:relative;
  font-variant-numeric: tabular-nums;
}
svg{ stroke-linecap:round; stroke-linejoin:round; }
button, input, select, textarea{ font-family:inherit; font-size:inherit; color:inherit; }
button{ cursor:pointer; }
::selection{ background:var(--accent-soft); }
:focus-visible{ outline:none; box-shadow:0 0 0 3px var(--accent-ring); border-radius:4px; }
[dir="auto"]{ unicode-bidi: plaintext; }
a{ color:inherit; }
@media (prefers-reduced-motion: reduce){ *{ animation-duration:0.001ms !important; transition-duration:0.001ms !important; } }

.icon{ display:inline-block; flex-shrink:0; }
.btn{ display:inline-flex; align-items:center; gap:6px; border:1px solid var(--line); background:var(--bg-raised); color:var(--ink); padding:7px 12px; border-radius:10px; font-size:12.5px; font-weight:500; }
.btn:hover{ background:var(--line-soft); }
.btn.primary{ background:var(--accent); border-color:var(--accent); color:#fff; }
.btn.primary:hover{ background:var(--accent-ink); }
.btn.ghost{ border-color:transparent; background:transparent; }
.btn.ghost:hover{ background:var(--line-soft); }
.btn.danger{ color:var(--danger); }
.btn.sm{ padding:5px 9px; font-size:11.5px; }
.icon-btn{ display:flex; align-items:center; justify-content:center; width:30px; height:30px; border:none; background:transparent; color:var(--ink-soft); border-radius:9px; }
.icon-btn:hover{ background:var(--line-soft); color:var(--ink); }
.icon-btn.active{ background:var(--accent-soft); color:var(--accent-ink); }

.shell{ position:relative; z-index:1; display:flex; min-height:100vh; }

.rail{
  width:220px; flex-shrink:0; padding:calc(16px + var(--safe-t)) 10px 16px;
  display:flex; flex-direction:column; gap:2px; position:sticky; top:0; height:100vh; overflow-y:auto;
  border-inline-end:1px solid var(--hairline);
  background:color-mix(in srgb, var(--bg) 72%, transparent);
  -webkit-backdrop-filter:saturate(180%) blur(24px); backdrop-filter:saturate(180%) blur(24px);
}
.rail-brand{ display:flex; align-items:center; gap:9px; padding:2px 8px 16px; }
.rail-brand-mark{ width:30px; height:30px; display:flex; align-items:center; justify-content:center; flex-shrink:0; color:var(--accent); background:var(--accent-soft); border-radius:9px; }
.rail-brand-text{ font-size:13px; font-weight:700; line-height:1.2; }
.rail-status{ font-size:10.5px; display:flex; align-items:center; gap:4px; }
.rail-status.ok{ color:var(--ok); }
.rail-status.warn{ color:var(--warn); }
.rail-status-dot{ width:6px; height:6px; border-radius:50%; background:currentColor; flex-shrink:0; }
.rail-section-label{ font-size:10px; text-transform:uppercase; letter-spacing:.06em; color:var(--ink-faint); padding:14px 10px 4px; font-weight:600; }
.rail-item{
  display:flex; align-items:center; gap:8px; width:100%; text-align:start; border:none;
  background:transparent; color:var(--ink-soft); padding:7px 10px; border-radius:var(--radius-sm);
  font-size:12.5px; font-weight:500; position:relative;
}
.rail-item:hover{ background:var(--line-soft); color:var(--ink); }
.rail-item.active{ background:var(--accent-soft); color:var(--accent-ink); font-weight:600; }
.rail-item .icon{ opacity:.85; flex-shrink:0; }
.rail-dot{ width:8px; height:8px; border-radius:50%; flex-shrink:0; }
.rail-label{ flex:1; overflow:hidden; text-overflow:ellipsis; white-space:nowrap; }
.rail-count{ font-size:10px; color:var(--ink-faint); }
.rail-item.active .rail-count{ color:var(--accent-ink); opacity:0.75; }
.rail-count.badge{ background:var(--danger); color:#fff; border-radius:8px; padding:1px 6px; font-weight:700; }
.rail-sep{ height:1px; background:var(--line); margin:10px 10px; }
.rail-add{ display:flex; align-items:center; gap:6px; border:1.5px dashed var(--line); background:transparent; color:var(--ink-faint); border-radius:20px; padding:6px 10px; font-size:11.5px; margin-top:4px; }
.rail-add:hover{ border-color:var(--accent); color:var(--accent-ink); }
.rail-row{ display:flex; align-items:center; position:relative; border-radius:var(--radius-sm); }
.rail-row .rail-item{ flex:1; min-width:0; }
.rail-row-menu{
  flex-shrink:0; width:22px; height:22px; display:flex; align-items:center; justify-content:center;
  border:none; background:transparent; color:var(--ink-faint); border-radius:7px; font-size:14px; line-height:1;
  opacity:0; transition:opacity .12s var(--ease-out); margin-inline-end:4px;
}
.rail-row:hover .rail-row-menu, .rail-row-menu.menu-open{ opacity:1; }
.rail-row-menu:hover{ background:var(--line-soft); color:var(--ink); }
.rail-foot{ margin-top:auto; padding-top:10px; display:flex; flex-direction:column; gap:2px; }

.main-col{ flex:1; min-width:0; padding:calc(18px + var(--safe-t)) 26px 60px; }
.view{ display:none; max-width:760px; margin-inline:auto; }
.view.active{ display:block; }
.view.wide{ max-width:1120px; }

.topbar{ display:flex; align-items:center; gap:8px; margin-bottom:18px; }
.topbar-title{ font-size:19px; font-weight:700; flex:1; min-width:0; }
.topbar-sub{ font-size:12px; color:var(--ink-faint); font-weight:500; margin-top:1px; }
.omni-trigger{
  flex:1; max-width:340px; display:flex; align-items:center; gap:8px; border:1px solid var(--line);
  background:var(--bg-raised); padding:8px 12px; border-radius:11px; color:var(--ink-faint); font-size:12.5px;
}
.omni-trigger:hover{ border-color:var(--hairline-strong); color:var(--ink-soft); }
.omni-trigger kbd{ margin-inline-start:auto; font-family:var(--font-mono-sys); font-size:10.5px; background:var(--surface-2); border:1px solid var(--line); border-radius:5px; padding:1px 5px; }

.viewswitch{ display:flex; align-items:center; border:1px solid var(--line); border-radius:10px; overflow:hidden; }
.viewswitch button{ border:none; background:var(--bg-raised); color:var(--ink-faint); padding:6px 9px; display:flex; }
.viewswitch button + button{ border-inline-start:1px solid var(--line); }
.viewswitch button.active{ background:var(--accent-soft); color:var(--accent-ink); }

.strip{ border:1px solid var(--hairline); background:var(--warn-soft); border-radius:var(--radius); padding:12px 14px; margin-bottom:16px; display:flex; align-items:center; gap:10px; }
.strip-text{ flex:1; font-size:12.5px; color:var(--ink); }
.strip-text b{ font-weight:700; }
.section-head{ display:flex; align-items:baseline; gap:8px; margin:22px 0 8px; }
.section-head:first-child{ margin-top:0; }
.section-title{ font-size:12px; font-weight:700; text-transform:uppercase; letter-spacing:.05em; color:var(--ink-faint); }
.section-count{ font-size:11px; color:var(--ink-faint); }

.omnibox-row{ position:relative; margin-bottom:14px; }
.omnibox-input-wrap{ display:flex; align-items:center; gap:8px; border:1px solid var(--line); background:var(--bg-raised); border-radius:var(--radius-sm); padding:10px 12px; box-shadow:var(--shadow-sm); }
.omnibox-input-wrap:focus-within{ border-color:var(--accent); box-shadow:0 0 0 3px var(--accent-ring); }
#omni-input{ flex:1; border:none; background:transparent; outline:none; font-size:13.5px; }
.omni-chips{ display:flex; flex-wrap:wrap; gap:5px; margin-top:6px; padding:0 2px; min-height:0; }
.chip{ display:inline-flex; align-items:center; gap:4px; font-size:10.5px; font-weight:600; padding:3px 8px; border-radius:20px; background:var(--surface-2); color:var(--ink-soft); border:1px solid var(--line); }
.chip.cat{ background:var(--accent-soft); color:var(--accent-ink); border-color:transparent; }
.chip.pri-high, .chip.pri-critical{ background:var(--danger-soft); color:var(--danger); border-color:transparent; }
.chip.pri-medium{ background:var(--warn-soft); color:var(--warn); border-color:transparent; }

.list{ display:flex; flex-direction:column; gap:0; }
.row{
  display:flex; align-items:flex-start; gap:10px; padding:9px 8px; border-radius:var(--radius-sm);
  position:relative;
}
.row:hover{ background:var(--line-soft); }
.row.done .row-title{ color:var(--ink-faint); text-decoration:line-through; text-decoration-color:var(--hairline-strong); }
.row-check{
  width:19px; height:19px; border-radius:50%; border:1.75px solid var(--hairline-strong); flex-shrink:0; margin-top:1px;
  display:flex; align-items:center; justify-content:center; background:var(--bg-raised); color:transparent;
}
.row-check:hover{ border-color:var(--accent); }
.row.done .row-check{ background:var(--ok); border-color:var(--ok); color:#fff; }
.row-check.pri-high, .row-check.pri-critical{ border-color:var(--danger); }
.row-main{ flex:1; min-width:0; cursor:pointer; }
.row-title-line{ display:flex; align-items:center; gap:6px; flex-wrap:wrap; }
.row-title{ font-size:13.5px; font-weight:500; }
.row-meta{ display:flex; align-items:center; gap:8px; margin-top:3px; flex-wrap:wrap; }
.row-meta-item{ display:flex; align-items:center; gap:3px; font-size:11px; color:var(--ink-faint); }
.row-meta-item.overdue{ color:var(--danger); font-weight:600; }
.row-meta-item.today{ color:var(--accent-ink); font-weight:600; }
.row-tag{ display:inline-flex; align-items:center; gap:4px; font-size:10.5px; color:var(--ink-soft); }
.row-tag-dot{ width:6px; height:6px; border-radius:50%; flex-shrink:0; }
.row-indent{ flex-shrink:0; }
.row-progress{ font-size:10.5px; color:var(--ink-faint); }
.row-actions{ display:flex; align-items:center; gap:2px; opacity:0; flex-shrink:0; }
.row:hover .row-actions{ opacity:1; }
.row.subtask{ padding-inline-start:30px; }
.row.subtask .row-title{ font-size:12.5px; }
.empty-state{ text-align:center; padding:48px 20px; color:var(--ink-faint); }
.empty-state .icon{ opacity:.4; margin-bottom:10px; }
.empty-state-title{ font-size:13.5px; font-weight:600; color:var(--ink-soft); margin-bottom:4px; }
.empty-state-sub{ font-size:12px; }

.stat-strip-item.clickable{ cursor:pointer; border:none; background:transparent; text-align:start; padding:0; font-family:inherit; }
.stat-strip-item.clickable:hover{ opacity:.72; }

.chart-grid{ display:grid; grid-template-columns:1fr 1fr; gap:14px; }
.chart-card{ background:var(--bg-raised); border:1px solid var(--hairline); border-radius:var(--radius); padding:14px 16px; box-shadow:var(--shadow-sm); }
.chart-card.wide{ grid-column:1/-1; }
.chart-card h3{ margin:0 0 10px; font-size:11px; font-weight:700; text-transform:uppercase; letter-spacing:.05em; color:var(--ink-faint); }
.chart-card-body{ height:220px; position:relative; }
@media (max-width:700px){ .chart-grid{ grid-template-columns:1fr; } }

.branch-progress-ring{ width:14px; height:14px; border-radius:50%; flex-shrink:0; margin-top:3px; }

.board{ display:flex; gap:14px; overflow-x:auto; padding-bottom:12px; }
.board-col{ flex:0 0 250px; }
.board-col-head{ display:flex; align-items:center; gap:6px; padding:0 4px 8px; font-size:12px; font-weight:700; color:var(--ink-soft); }
.board-card{ background:var(--bg-raised); border:1px solid var(--hairline); border-radius:var(--radius-sm); padding:9px 10px; margin-bottom:8px; box-shadow:var(--shadow-sm); cursor:pointer; }
.board-card:hover{ border-color:var(--hairline-strong); }
.board-card-title{ font-size:12.5px; font-weight:500; margin-bottom:5px; }
.board-card-meta{ display:flex; gap:6px; flex-wrap:wrap; }

.backdrop{ position:fixed; inset:0; background:rgba(20,18,16,.32); opacity:0; pointer-events:none; transition:opacity .16s var(--ease-out); z-index:40; }
.backdrop.show{ opacity:1; pointer-events:auto; }
:root[data-theme="dark"] .backdrop, @media (prefers-color-scheme:dark){ .backdrop{ background:rgba(0,0,0,.5); } }

.panel{
  position:fixed; top:0; bottom:0; inset-inline-end:0; width:400px; max-width:92vw; background:var(--bg-raised);
  box-shadow:var(--shadow-md); z-index:50; transform:translateX(105%); transition:transform .22s var(--ease-out);
  display:flex; flex-direction:column; padding-top:var(--safe-t);
}
[dir="rtl"] .panel{ transform:translateX(-105%); }
.panel.show{ transform:translateX(0); }
.panel-head{ display:flex; align-items:center; gap:6px; padding:14px 16px; border-bottom:1px solid var(--hairline); }
.panel-body{ flex:1; overflow-y:auto; padding:16px; }
.panel-foot{ padding:12px 16px; border-top:1px solid var(--hairline); display:flex; gap:8px; padding-bottom:calc(12px + var(--safe-b)); }

.modal-backdrop{ position:fixed; inset:0; background:rgba(20,18,16,.4); opacity:0; pointer-events:none; transition:opacity .15s; z-index:60; display:flex; align-items:flex-start; justify-content:center; padding:10vh 16px 16px; }
.modal-backdrop.show{ opacity:1; pointer-events:auto; }
.modal{ background:var(--bg-raised); border-radius:var(--radius-lg); box-shadow:var(--shadow-md); width:560px; max-width:100%; max-height:76vh; display:flex; flex-direction:column; transform:translateY(-8px); transition:transform .15s; overflow:hidden; }
.modal-backdrop.show .modal{ transform:translateY(0); }
.modal.wide{ width:640px; }

.field{ margin-bottom:14px; }
.field-label{ font-size:11px; font-weight:600; color:var(--ink-faint); text-transform:uppercase; letter-spacing:.04em; margin-bottom:5px; display:block; }
.field input[type=text], .field input[type=date], .field input[type=number], .field select, .field textarea{
  width:100%; border:1px solid var(--line); background:var(--surface-2); padding:8px 10px; border-radius:10px; font-size:13px;
}
.field textarea{ resize:vertical; min-height:70px; font-family:inherit; }
.field-row{ display:flex; gap:10px; }
.field-row > .field{ flex:1; }
.pillrow{ display:flex; gap:6px; flex-wrap:wrap; }
.pill{ border:1px solid var(--line); background:var(--bg-raised); padding:5px 11px; border-radius:20px; font-size:11.5px; font-weight:500; color:var(--ink-soft); }
.pill.active{ background:var(--accent); border-color:var(--accent); color:#fff; }
.pill.pri-high.active, .pill.pri-critical.active{ background:var(--danger); border-color:var(--danger); }
.pill.pri-medium.active{ background:var(--warn); border-color:var(--warn); color:#fff; }

.toast-wrap{ position:fixed; bottom:calc(18px + var(--safe-b)); inset-inline-start:50%; transform:translateX(-50%); z-index:80; display:flex; flex-direction:column; gap:6px; align-items:center; }
[dir="rtl"] .toast-wrap{ transform:translateX(50%); }
.toast{ display:flex; align-items:center; gap:10px; background:var(--ink); color:var(--bg); padding:9px 14px; border-radius:11px; font-size:12.5px; box-shadow:var(--shadow-md); }
:root[data-theme="dark"] .toast{ background:var(--bg-raised); color:var(--ink); border:1px solid var(--hairline-strong); }
.toast button{ background:transparent; border:none; color:inherit; font-weight:700; text-decoration:underline; font-size:12px; }

@media (max-width: 860px){
  .rail{ display:none; }
  .main-col{ padding:calc(14px + var(--safe-t)) 14px 90px; }
  .panel{ inset-inline:0; width:auto; max-width:none; top:auto; height:86vh; border-radius:18px 18px 0 0; transform:translateY(105%); box-shadow:0 -12px 40px rgba(0,0,0,.2); }

  .mobile-tabbar{ display:flex; position:fixed; bottom:0; inset-inline:0; background:color-mix(in srgb, var(--bg) 85%, transparent); -webkit-backdrop-filter:blur(20px); backdrop-filter:blur(20px); border-top:1px solid var(--hairline); padding:6px 4px calc(6px + var(--safe-b)); z-index:30; }

.stat-strip{ display:flex; gap:20px; margin-bottom:14px; padding:0 2px; }

.row.branch-row{ padding-inline-start:34px; }

.avatar-roundel{ width:22px; height:22px; border-radius:50%; display:flex; align-items:center; justify-content:center; font-size:9.5px; font-weight:700; color:#fff; flex-shrink:0; }

.avatar-pick-row{ display:flex; gap:6px; flex-wrap:wrap; }

.branch-edit-row{ border:1px solid var(--line); border-radius:var(--radius-sm); padding:10px; margin-bottom:8px; background:var(--surface-2); }

.branch-edit-foot{ display:flex; justify-content:flex-end; }
.add-branch-btn{ width:100%; border:1.5px dashed var(--line); background:transparent; color:var(--ink-faint); border-radius:var(--radius-sm); padding:9px; font-size:12.5px; font-weight:500; margin-bottom:14px; }

.date-chip-row{ margin-bottom:10px; }
.date-chip{ display:inline-flex; align-items:center; gap:6px; background:var(--accent-soft); color:var(--accent-ink); padding:5px 10px; border-radius:20px; font-size:12px; font-weight:600; }
.date-chip.suggestion{ background:var(--brass-soft); color:var(--brass-ink); }
.date-chip button{ background:transparent; border:none; color:inherit; font-weight:700; padding:0; margin-inline-start:2px; }

.bulk-bar{ position:fixed; bottom:calc(18px + var(--safe-b)); inset-inline-start:50%; transform:translate(-50%,12px); background:var(--ink); color:#fff; padding:8px 10px; border-radius:14px; display:flex; align-items:center; gap:4px; box-shadow:var(--shadow-md); z-index:45; opacity:0; pointer-events:none; transition:opacity .15s var(--ease-out), transform .15s var(--ease-out); flex-wrap:wrap; max-width:92vw; justify-content:center; }
.bulk-bar.show{ opacity:1; pointer-events:auto; transform:translate(-50%,0); }
.bulk-count{ font-size:11.5px; font-weight:600; padding:0 8px 0 4px; opacity:.85; }
.bulk-bar button{ border:none; background:rgba(255,255,255,.12); color:#fff; padding:6px 11px; border-radius:999px; font-size:11.5px; font-weight:500; white-space:nowrap; }
.bulk-bar button:hover{ background:rgba(255,255,255,.22); }

.staff-grid{ display:grid; grid-template-columns:repeat(auto-fill,minmax(230px,1fr)); gap:12px; margin-bottom:20px; }

.staff-remove{ position:absolute; top:8px; inset-inline-end:8px; width:22px; height:22px; border:none; background:transparent; color:var(--ink-faint); border-radius:7px; font-size:15px; opacity:0; line-height:1; }
.staff-card:hover .staff-remove{ opacity:1; }
.staff-remove:hover{ background:var(--danger-soft); color:var(--danger); }
.staff-card-head{ display:flex; align-items:center; gap:10px; margin-bottom:12px; }
.staff-name{ font-size:13px; font-weight:700; }

.staff-stats{ display:grid; grid-template-columns:repeat(4,1fr); gap:6px; margin-bottom:8px; }
.stat-num{ font-size:15px; font-weight:700; }
.stat-num.danger{ color:var(--danger); }
.stat-label{ font-size:9.5px; color:var(--ink-faint); }
.staff-stats-sub{ display:flex; justify-content:space-between; font-size:10.5px; color:var(--ink-faint); margin-bottom:10px; gap:8px; }
.stat-num-sample{ opacity:.6; font-weight:400; }
.progress-bar{ height:5px; background:var(--surface-sunken); border-radius:4px; overflow:hidden; margin-bottom:10px; }
.progress-fill{ height:100%; background:var(--ok); }
.staff-items{ display:flex; flex-direction:column; gap:4px; }
.staff-item-row{ display:flex; align-items:center; gap:6px; font-size:11px; color:var(--ink-soft); }
.status-dot-mini{ width:6px; height:6px; border-radius:50%; flex-shrink:0; background:var(--ink-faint); }
.status-dot-mini.done{ background:var(--ok); }
.status-dot-mini.in_progress{ background:var(--brass); }
.add-tile{ display:flex; align-items:center; justify-content:center; border:1.5px dashed var(--line); background:transparent; color:var(--ink-faint); border-radius:var(--radius); min-height:120px; font-size:12.5px; font-weight:500; }
.add-tile:hover{ border-color:var(--accent); color:var(--accent-ink); }
.team-table-scroll{ overflow-x:auto; }
.team-table{ width:100%; border-collapse:collapse; font-size:12px; }
.team-table th{ text-align:start; padding:8px 10px; font-size:10.5px; text-transform:uppercase; color:var(--ink-faint); border-bottom:1px solid var(--hairline-strong); cursor:pointer; white-space:nowrap; }
.team-table td{ padding:8px 10px; border-bottom:1px solid var(--hairline); }
.team-table td.num{ text-align:end; font-variant-numeric:tabular-nums; }
.team-table td.num.danger{ color:var(--danger); font-weight:600; }
.sort-arrow{ opacity:.5; margin-inline-start:3px; font-size:9px; }
.team-toggle{ display:flex; border:1px solid var(--line); border-radius:10px; overflow:hidden; margin-bottom:14px; width:fit-content; }
.team-toggle button{ border:none; background:var(--bg-raised); padding:6px 12px; font-size:12px; color:var(--ink-faint); }
.team-toggle button[aria-pressed="true"]{ background:var(--accent-soft); color:var(--accent-ink); }

.new-btn{ display:inline-flex; align-items:center; gap:6px; background:var(--accent); border:1px solid var(--accent); color:#fff; padding:8px 14px; border-radius:11px; font-size:12.5px; font-weight:600; flex-shrink:0; }
.new-btn:hover{ background:var(--accent-ink); }
.fab{ display:none; }
.row.selected{ background:var(--accent-soft); }
.row.selected .row-check{ border-color:var(--accent); }
.inline-add-row{ display:flex; align-items:center; gap:10px; padding:9px 8px; }
.inline-add-row input{ flex:1; border:none; background:transparent; font-size:12.5px; color:var(--ink-faint); }

.rail-row.drag-source{ opacity:.35; }
.rail-item.drag-over{ box-shadow:inset 0 -2px 0 var(--accent); }

.field-date-btn, .select-btn{
  width:100%; text-align:start; border:1px solid var(--line); background:var(--surface-2);

}

.field-date-btn .fdb-label, .select-btn .sb-label{ flex:1; overflow:hidden; text-overflow:ellipsis; white-space:nowrap; }

.popover-surface{
  position:fixed; z-index:95; background:var(--bg-raised); border:1px solid var(--hairline);
  border-radius:var(--radius); box-shadow:var(--shadow-raised); padding:12px;
}

  display:flex; align-items:center; gap:6px; width:100%; text-align:start; border:none; background:transparent;
  padding:8px 10px; border-radius:8px; font-size:12.5px; color:var(--ink);
}
.select-opt:hover{ background:var(--line-soft); }
.select-opt.active{ background:var(--accent-soft); color:var(--accent-ink); font-weight:600; }

.datepicker{ width:264px; }
.dp-head{ display:flex; align-items:center; justify-content:space-between; margin-bottom:8px; }
.dp-nav{ width:26px; height:26px; border:none; background:transparent; border-radius:7px; color:var(--ink-soft); display:flex; align-items:center; justify-content:center; flex-shrink:0; }
.dp-nav:hover{ background:var(--line-soft); color:var(--ink); }
.dp-title{ font-size:12.5px; font-weight:700; border:none; background:transparent; padding:5px 10px; border-radius:8px; color:var(--ink); }
.dp-title:hover{ background:var(--line-soft); }
.dp-grid{ display:grid; grid-template-columns:repeat(7,1fr); gap:2px; }
.dp-dow{ font-size:9.5px; color:var(--ink-faint); text-align:center; padding:4px 0 6px; font-weight:700; text-transform:uppercase; }

.dp-day:hover{ background:var(--line-soft); }
.dp-day.today{ font-weight:700; color:var(--accent-ink); box-shadow:inset 0 0 0 1.5px var(--accent); }
.dp-day.selected{ background:var(--accent); color:#fff; font-weight:700; }
.dp-day.other-month{ color:var(--ink-faint); opacity:.45; }
.dp-foot{ display:flex; justify-content:space-between; align-items:center; margin-top:10px; padding-top:10px; border-top:1px solid var(--hairline); }
.dp-foot button{ font-size:11.5px; color:var(--accent-ink); background:transparent; border:none; font-weight:600; padding:4px 6px; border-radius:6px; }
.dp-foot button:hover{ background:var(--accent-soft); }
.dp-foot button.dp-clear{ color:var(--ink-faint); }
.dp-year-step{ display:flex; align-items:center; justify-content:center; gap:18px; margin-bottom:10px; font-weight:700; font-size:13.5px; }
.dp-month-grid{ display:grid; grid-template-columns:repeat(3,1fr); gap:6px; }

.dp-month-cell.current{ background:var(--accent-soft); color:var(--accent-ink); }

.settings-section{ background:var(--surface-2); border:1px solid var(--hairline); border-radius:var(--radius); padding:14px 16px; margin-bottom:14px; }
.settings-section-head{ display:flex; align-items:center; gap:8px; margin-bottom:12px; }

.settings-section-title{ font-size:12.5px; font-weight:700; }
.settings-section-sub{ font-size:11px; color:var(--ink-faint); margin-top:1px; }
.settings-row{ display:flex; align-items:center; gap:10px; padding:8px 0; border-bottom:1px solid var(--hairline); }
.settings-row:last-of-type{ border-bottom:none; }
.settings-empty{ font-size:11.5px; color:var(--ink-faint); padding:6px 0; }

  .fab{ display:flex; align-items:center; justify-content:center; position:fixed; bottom:calc(70px + var(--safe-b)); inset-inline-end:18px; width:52px; height:52px; border-radius:50%; background:var(--accent); color:#fff; border:none; box-shadow:var(--shadow-md); z-index:35; }
  .new-btn{ display:none; }
  .staff-grid{ grid-template-columns:1fr; }
}

<script>
(function(){
"use strict";
var DB_NAME = "todo_v4_db";
var DB_VERSION = 1;
var LEGACY_V1_KEY = "governance_tracker_v3";
var LEGACY_V2_IDB_KEY = "state";
var THEME_KEY = "todo_theme";
var DENSITY_KEY = "todo_density";
var VIEW_KEY = "todo_view";
var PRIORITIES = ["low","medium","high","critical"];
var PRIORITY_N = {low:1, medium:2, high:3, critical:4};
var PRIORITY_LABEL = {low:"Low", medium:"Medium", high:"High", critical:"Critical"};
var STATUSES = ["todo","in_progress","done"];
var STATUS_LABEL = {todo:"To do", in_progress:"In progress", done:"Done"};
var PALETTE = ["#9A5B4C","#5E7D63","#5B7C99","#8A6A9C","#A8791F","#4A7A8C","#7A5C3E"];
var WEEKDAY_SHORT = ["Sun","Mon","Tue","Wed","Thu","Fri","Sat"];
var WEEKDAY_LABEL = ["Sunday","Monday","Tuesday","Wednesday","Thursday","Friday","Saturday"];
var MONTH_SHORT = ["Jan","Feb","Mar","Apr","May","Jun","Jul","Aug","Sep","Oct","Nov","Dec"];
var SNAPSHOT_CAP = 20;
var COMPACT_AT = 50;
var EMPTY_ARR = [];

function uid(prefix){ return prefix + Date.now().toString(36) + Math.random().toString(36).slice(2,8); }
function esc(s){
  return String(s==null?"":s).replace(/[&<>"']/g, function(c){
    return {"&":"&amp;","<":"&lt;",">":"&gt;","\"":"&quot;","'":"&#39;"}[c];
  });
}
function debounce(fn, wait){
  var t = null;
  return function(){
    var args = arguments, ctx = this;
    if(t) clearTimeout(t);
    t = setTimeout(function(){ t=null; fn.apply(ctx, args); }, wait);
  };
}
function clamp(n,a,b){ return Math.max(a, Math.min(b,n)); }
function localISO(d){
  d = d || new Date();
  var y = d.getFullYear(), m = d.getMonth()+1, day = d.getDate();
  return y + "-" + (m<10?"0"+m:m) + "-" + (day<10?"0"+day:day);
}
function todayISO(){ return localISO(new Date()); }
function nowISO(){ return new Date().toISOString(); }
function addDaysISO(iso, n){
  var d = new Date(iso + "T00:00:00");
  d.setDate(d.getDate()+n);
  return localISO(d);
}
function fmtDate(iso){
  if(!iso) return "";
  var d = new Date(iso + "T00:00:00");
  if(isNaN(d.getTime())) return iso;
  var todayD = new Date(todayISO()+"T00:00:00");
  var diffDays = Math.round((d-todayD)/86400000);
  if(diffDays===0) return "Today";
  if(diffDays===1) return "Tomorrow";
  if(diffDays===-1) return "Yesterday";
  if(diffDays>1 && diffDays<7) return WEEKDAY_SHORT[d.getDay()];
  return MONTH_SHORT[d.getMonth()] + " " + d.getDate() + (d.getFullYear()!==todayD.getFullYear() ? ", "+d.getFullYear() : "");
}
function fmtDateHeader(iso){
  var d = new Date(iso + "T00:00:00");
  var todayD = new Date(todayISO()+"T00:00:00");
  var diffDays = Math.round((d-todayD)/86400000);
  if(diffDays===0) return "Today";
  if(diffDays===1) return "Tomorrow";
  if(diffDays>1 && diffDays<7) return WEEKDAY_LABEL[d.getDay()];
  return WEEKDAY_SHORT[d.getDay()] + ", " + MONTH_SHORT[d.getMonth()] + " " + d.getDate();
}
function fmtClock(d){
  d = d || new Date();
  var h = d.getHours(), m = d.getMinutes();
  var ap = h>=12 ? "PM" : "AM";
  var h12 = h%12; if(h12===0) h12=12;
  return h12 + ":" + (m<10?"0"+m:m) + " " + ap;
}
function median(arr){
  if(!arr.length) return null;
  var a = arr.slice().sort(function(x,y){ return x-y; });
  var n = a.length, mid = n >> 1;
  return n % 2 ? a[mid] : (a[mid-1] + a[mid]) / 2;
}
function formatDuration(ms){
  if(ms == null) return null;
  var d = ms / 86400000;
  if(d < 1) return "<1d";
  return (d < 10 ? String(Math.round(d*10)/10) : String(Math.round(d))) + "d";
}

function h(tag, attrs, children){
  var el = document.createElement(tag);
  if(attrs){
    for(var k in attrs){
      if(!Object.prototype.hasOwnProperty.call(attrs,k)) continue;
      var v = attrs[k];
      if(v==null || v===false) continue;
      if(k==="class") el.className = v;
      else if(k==="html") el.innerHTML = v;
      else if(k==="text") el.textContent = v;
      else if(k.indexOf("on")===0 && typeof v==="function") el.addEventListener(k.slice(2).toLowerCase(), v);
      else if(k==="style" && typeof v==="object"){ for(var sk in v) el.style[sk]=v[sk]; }
      else if(v===true) el.setAttribute(k,"");
      else el.setAttribute(k, v);
    }
  }
  (children||[]).forEach(function(c){
    if(c==null) return;
    if(typeof c==="string") el.appendChild(document.createTextNode(c));
    else el.appendChild(c);
  });
  return el;
}
function svgIcon(name, size, strokeWidth){
  var s = size||14;
  var e = document.createElementNS("http://www.w3.org/2000/svg","svg");
  e.setAttribute("class","icon"); e.setAttribute("width",s); e.setAttribute("height",s);
  e.setAttribute("viewBox","0 0 24 24"); e.setAttribute("fill","none");
  e.setAttribute("stroke","currentColor"); e.setAttribute("stroke-width", strokeWidth||2);
  var use = document.createElementNS("http://www.w3.org/2000/svg","use");
  use.setAttribute("href","#i-"+name);
  e.appendChild(use);
  return e;
}
function reconcileList(container, items, keyFn, renderFn, updateFn){
  var existing = new Map();
  for(var i=0;i<container.children.length;i++){
    var node = container.children[i];
    if(node.dataset && node.dataset.rkey) existing.set(node.dataset.rkey, node);
  }
  var frag = document.createDocumentFragment();
  var used = new Set();
  items.forEach(function(item){
    var key = String(keyFn(item));
    used.add(key);
    var node = existing.get(key);
    if(node){
      if(updateFn) updateFn(node, item);
      frag.appendChild(node);
    } else {
      node = renderFn(item);
      node.dataset.rkey = key;
      frag.appendChild(node);
    }
  });
  existing.forEach(function(node, key){ if(!used.has(key)) node.remove(); });
  container.innerHTML = "";
  container.appendChild(frag);
}

var focusTrapStack = [];
var FOCUSABLE_SEL = 'button:not([disabled]), input:not([disabled]), textarea:not([disabled]), select:not([disabled]), [tabindex]:not([tabindex="-1"])';
function trapFocus(container){
  var entry = { container: container, returnEl: document.activeElement, handler: null };
  entry.handler = function(e){
    if(e.key!=="Tab") return;
    if(focusTrapStack[focusTrapStack.length-1] !== entry) return;
    var focusables = Array.prototype.filter.call(container.querySelectorAll(FOCUSABLE_SEL), function(el){ return el.offsetParent!==null || el===document.activeElement; });
    if(!focusables.length) return;
    var first = focusables[0], last = focusables[focusables.length-1];
    if(e.shiftKey && document.activeElement===first){ e.preventDefault(); last.focus(); }
    else if(!e.shiftKey && document.activeElement===last){ e.preventDefault(); first.focus(); }
  };
  document.addEventListener("keydown", entry.handler);
  focusTrapStack.push(entry);
}
function releaseFocusTrap(){
  var entry = focusTrapStack.pop();
  if(!entry) return;
  document.removeEventListener("keydown", entry.handler);
  if(entry.returnEl && document.body.contains(entry.returnEl) && typeof entry.returnEl.focus==="function"){
    entry.returnEl.focus();
  }
}

var hasFSA = typeof window.showSaveFilePicker === "function";
var idbPromise = null;
function idbOpen(){
  if(idbPromise) return idbPromise;
  idbPromise = new Promise(function(resolve,reject){
    if(!window.indexedDB){ reject(new Error("no-idb")); return; }
    var req = indexedDB.open(DB_NAME, DB_VERSION);
    req.onupgradeneeded = function(){
      var db = req.result;
      if(!db.objectStoreNames.contains("kv")) db.createObjectStore("kv");
      if(!db.objectStoreNames.contains("snapshots")) db.createObjectStore("snapshots", {keyPath:"ts"});
    };
    req.onsuccess = function(){ resolve(req.result); };
    req.onerror = function(){ reject(req.error); };
  });
  return idbPromise;
}
function idbGet(store, key){
  return idbOpen().then(function(db){
    return new Promise(function(resolve,reject){
      var tx = db.transaction(store,"readonly");
      var req = tx.objectStore(store).get(key);
      req.onsuccess=function(){ resolve(req.result===undefined?null:req.result); };
      req.onerror=function(){ reject(req.error); };
    });
  });
}
function idbSet(store, key, val){
  return idbOpen().then(function(db){
    return new Promise(function(resolve,reject){
      var tx = db.transaction(store,"readwrite");
      tx.objectStore(store).put(val, key);
      tx.oncomplete=function(){ resolve(true); };
      tx.onerror=function(){ reject(tx.error); };
    });
  });
}
function idbPutKeyed(store, val){
  return idbOpen().then(function(db){
    return new Promise(function(resolve,reject){
      var tx = db.transaction(store,"readwrite");
      tx.objectStore(store).put(val);
      tx.oncomplete=function(){ resolve(true); };
      tx.onerror=function(){ reject(tx.error); };
    });
  });
}
function idbGetAll(store){
  return idbOpen().then(function(db){
    return new Promise(function(resolve,reject){
      var tx = db.transaction(store,"readonly");
      var req = tx.objectStore(store).getAll();
      req.onsuccess=function(){ resolve(req.result||[]); };
      req.onerror=function(){ reject(req.error); };
    });
  });
}
function idbDelete(store,key){
  return idbOpen().then(function(db){
    return new Promise(function(resolve,reject){
      var tx = db.transaction(store,"readwrite");
      tx.objectStore(store).delete(key);
      tx.oncomplete=function(){ resolve(true); };
      tx.onerror=function(){ reject(tx.error); };
    });
  });
}

var Vault = {
  handle: null, status: "checking", lastSavedAt: null, filename: "todos.json",
  init: function(){
    var self = this;
    if(!hasFSA){ self.status="local-only"; return Promise.resolve(); }
    return idbGet("kv","vaultHandle").then(function(hd){
      if(!hd){ self.status="local-only"; return; }
      self.handle = hd; self.filename = hd.name || self.filename;
      return hd.queryPermission({mode:"readwrite"}).then(function(perm){
        self.status = perm==="granted" ? "connected" : "permission-needed";
      });
    }).catch(function(){ self.status="local-only"; });
  },
  connect: function(){
    var self = this;
    if(!hasFSA) return Promise.resolve(false);
    return window.showSaveFilePicker({suggestedName:"todos.json", types:[{description:"JSON", accept:{"application/json":[".json"]}}]})
      .then(function(hd){
        self.handle = hd; self.filename = hd.name;
        return idbSet("kv","vaultHandle", hd).then(function(){ self.status="connected"; return true; });
      }).catch(function(){ return false; });
  },
  reconnectPermission: function(){
    var self = this;
    if(!self.handle) return Promise.resolve(false);
    return self.handle.requestPermission({mode:"readwrite"}).then(function(perm){
      self.status = perm==="granted" ? "connected" : "permission-needed";
      return perm==="granted";
    }).catch(function(){ return false; });
  },
  writeFile: function(text){
    var self = this;
    if(!self.handle || self.status!=="connected") return Promise.resolve(false);
    return self.handle.createWritable().then(function(w){
      return w.write(text).then(function(){ return w.close(); });
    }).then(function(){ self.lastSavedAt = new Date(); return true; })
      .catch(function(){ return false; });
  }
};

var SYNC_CONFIG_KEY = "todo_sync_cfg_v1";
var SheetsSync = (function(){
  var cfg = { clientId:"", sheetId:"" };
  var accessToken = null;
  var tokenClient = null;

  function loadCfg(){ try{ var raw=localStorage.getItem(SYNC_CONFIG_KEY); if(raw) cfg=JSON.parse(raw); }catch(e){} }
  function saveCfg(){ try{ localStorage.setItem(SYNC_CONFIG_KEY, JSON.stringify(cfg)); }catch(e){} }

  function encodeAssignees(assignees){
    return (assignees||[]).map(function(a){ return a.staffId + (a.isLead?"*":""); }).join(";");
  }
  function decodeAssignees(str){
    if(!str) return [];
    return String(str).split(";").map(function(t){ return t.trim(); }).filter(Boolean).map(function(tok){
      var isLead = tok.charAt(tok.length-1)==="*";
      return { staffId: isLead?tok.slice(0,-1):tok, isLead:isLead };
    });
  }
  function groupsToRows(groups){ return groups.map(function(g){ return [g.id, g.name, g.color||"", g.order==null?"":g.order]; }); }
  function rowsToGroups(rows){
    return (rows||[]).filter(function(r){ return r[0]; }).map(function(r,i){
      var ord = parseInt(r[3],10);
      return { id:r[0], name:r[1]||"Untitled", color:r[2]||PALETTE[i%PALETTE.length], order:isNaN(ord)?i:ord };
    });
  }
  function staffToRows(people){ return people.map(function(p){ return [p.id, p.name, p.dept||"", p.color||""]; }); }
  function rowsToStaff(rows){
    return (rows||[]).filter(function(r){ return r[0]; }).map(function(r,i){
      return { id:r[0], name:r[1]||"Unknown", dept:r[2]||"", color:r[3]||PALETTE[i%PALETTE.length] };
    });
  }
  function itemsToRows(items){
    return items.map(function(it){
      return [ it.id, it.parentId||"", it.groupId||"", it.title||"", it.due||"",
        encodeAssignees(it.assignees), it.priority||"medium", it.status||"todo", it.notes||"",
        it.createdAt||"", it.completedAt||"", it.firstCompletedAt||"",
        it.start||"", it.recur?JSON.stringify(it.recur):"", it.seriesId||"" ];
    });
  }
  function rowsToItems(rows){
    return (rows||[]).filter(function(r){ return r[0]; }).map(function(r){
      var recur = null;
      if(r[13]){ try{ recur = JSON.parse(r[13]); }catch(e){ recur=null; } }
      return { id:r[0], parentId:r[1]||null, groupId:r[2]||null, title:cleanTitle(r[3])||"Untitled", due:r[4]||null,
        assignees:decodeAssignees(r[5]), priority: PRIORITY_N[r[6]]?r[6]:"medium", status: STATUSES.indexOf(r[7])>=0?r[7]:"todo", notes:r[8]||"",
        createdAt:r[9]||nowISO(), completedAt:r[10]||null, firstCompletedAt:r[11]||null,
        start:r[12]||null, recur:recur, seriesId:r[14]||null };
    });
  }
  function statusLabel(){
    if(!cfg.clientId || !cfg.sheetId) return "Not set up";
    return accessToken ? "Connected" : "Not connected";
  }

  function api(){ return {
    isConnected: function(){ return !!accessToken; },
    statusLabel: statusLabel,
    getConfig: function(){ return cfg; },
    setConfig: function(clientId, sheetId){ cfg={clientId:(clientId||"").trim(), sheetId:(sheetId||"").trim()}; saveCfg(); },
    connect: function(onDone){
      if(!cfg.clientId){ showToast("Add a Client ID first."); return; }

function migrateFromV2(legacy){
  var groups = (legacy.tags||[]).map(function(t,idx){
    return {id:t.id, name:t.name, color:t.color||PALETTE[idx%PALETTE.length], order: t.order==null?idx:t.order};
  });
  var groupById = {}; groups.forEach(function(g){ groupById[g.id]=g; });
  var knownPeople = {}; (legacy.people||[]).forEach(function(p){ knownPeople[p.id]=p; });
  var people = (legacy.people||[]).map(function(p){ return {id:p.id, name:p.name, dept:"", color:p.color||PALETTE[0]}; });
  var items = [];
  (legacy.items||[]).forEach(function(it){
    var tags = it.tags||[];
    var groupId = tags.length ? tags[0] : null;
    var extraTagLines = tags.slice(1).map(function(tid){ var g=groupById[tid]; return g ? "["+g.name+"]" : null; }).filter(Boolean);
    var notes = it.notes||"";
    if(extraTagLines.length) notes = (notes ? notes+"\n" : "") + extraTagLines.join("\n");
    var assignees = (it.people||[]).map(function(pid, i){
      if(!knownPeople[pid]){
        var np = {id:pid, name:"Unknown", dept:"", color:PALETTE[0]};
        knownPeople[pid]=np; people.push(np);
      }
      return {staffId:pid, isLead: i===0};
    });
    items.push({
      id: it.id, parentId: it.parentId||null, groupId: groupId,
      title: cleanTitle(it.title) || "Untitled", notes: notes,
      assignees: assignees, priority: it.priority||"medium", status: it.status||"todo",
      due: it.due||null, start: it.start||null, recur: it.recur||null, seriesId: it.seriesId||null,
      createdAt: it.createdAt||nowISO(), completedAt: it.completedAt||null, firstCompletedAt: it.firstCompletedAt||null
    });
    (it.checklist||[]).forEach(function(c){
      items.push({
        id: c.id, parentId: it.id, groupId: groupId, title: cleanTitle(c.text)||"Untitled", notes:"",
        assignees:[], priority:"medium", status: c.done?"done":"todo",
        due:null, start:null, recur:null, seriesId:null,
        createdAt: it.createdAt||nowISO(), completedAt: c.done?nowISO():null, firstCompletedAt: c.done?nowISO():null
      });
    });
  });
  return {version:4, groups:groups, people:people, items:items, meta:{createdAt: nowISO(), lastOpenedAt: nowISO(), migratedFrom:"v2"}};
}

function aoaToRowObjects(aoa){
  if(!aoa || aoa.length<2) return [];
  var header = (aoa[0]||[]).map(function(hh){ return String(hh==null?"":hh).trim().toLowerCase(); });
  var out = [];
  for(var r=1;r<aoa.length;r++){
    var line = aoa[r];
    if(!line || line.every(function(c){ return c==null || String(c).trim()===""; })) continue;
    var row = {};
    header.forEach(function(hh,i){ row[hh] = line[i]==null ? "" : String(line[i]); });
    out.push(row);
  }
  return out;
}
function parseCSVText(text){
  var lines = text.split(/\r\n|\n/).filter(function(l){ return l.length; });
  if(!lines.length) return [];
  function splitRow(line){
    var out=[], cur="", inQ=false;
    for(var i=0;i<line.length;i++){
      var c=line[i];
      if(inQ){
        if(c==='"'){ if(line[i+1]==='"'){ cur+='"'; i++; } else inQ=false; }
        else cur+=c;
      } else {
        if(c===','){ out.push(cur); cur=""; }
        else if(c==='"') inQ=true;
        else cur+=c;
      }
    }
    out.push(cur);
    return out;
  }
  return aoaToRowObjects(lines.map(splitRow));
}
function parseXLSXFile(file, cb){
  ensureXlsx().then(function(){

    reader.onload = function(){
      try{

        var ws = wb.Sheets[wb.SheetNames[0]];
        var aoa = XLSX.utils.sheet_to_json(ws, {header:1, raw:false, defval:""});
        cb(null, aoaToRowObjects(aoa));
      }catch(e){ cb(e); }
    };
    reader.onerror = function(){ cb(new Error("read-failed")); };
    reader.readAsArrayBuffer(file);
  }).catch(function(){
    showToast("Couldn't reach the spreadsheet library \u2014 check your connection and try again.");
  });
}
function readTabularFile(f, cb){
  var isCsv = /\.csv$/i.test(f.name) || f.type==="text/csv";
  if(isCsv){
    var reader = new FileReader();
    reader.onload = function(){ cb(parseCSVText(String(reader.result))); };
    reader.onerror = function(){ showToast("Couldn't read that file."); };
    reader.readAsText(f);
  } else {
    parseXLSXFile(f, function(err, rows){
      if(err){ showToast("Couldn't read that file."); return; }
      cb(rows);
    });
  }
}

      due: r.due||null, start:null, recur:null, seriesId:null,

function nextOccurrence(recur, fromDue, completedAt){
  var base = fromDue || todayISO();
  switch(recur.freq){
    case "daily": return addDaysISO(base, recur.interval||1);
    case "after_days": return addDaysISO(localISO(new Date(completedAt||nowISO())), recur.interval||1);
    case "weekdays": {
      var d1 = new Date(base+"T00:00:00");
      do{ d1.setDate(d1.getDate()+1); } while(d1.getDay()===0 || d1.getDay()===6);
      return localISO(d1);
    }
    case "weekly": return addDaysISO(base, 7*(recur.interval||1));
    case "monthly_date": {
      var d2 = new Date(base+"T00:00:00");
      d2.setMonth(d2.getMonth() + (recur.interval||1));
      return localISO(d2);
    }
    case "monthly_weekday": {
      var d3 = new Date(base+"T00:00:00");
      d3.setMonth(d3.getMonth() + (recur.interval||1));
      d3.setDate(1);
      var count=0;
      while(true){
        if(d3.getDay()===recur.weekday){ count++; if(count===(recur.nth||1)) break; }
        d3.setDate(d3.getDate()+1);
      }
      return localISO(d3);
    }
    case "yearly": {
      var d4 = new Date(base+"T00:00:00");
      d4.setFullYear(d4.getFullYear() + (recur.interval||1));
      return localISO(d4);
    }
    default: return null;
  }
}
var RECUR_LABELS = { daily:"Every day", after_days:"days after done", weekdays:"Weekdays", weekly:"Every week", monthly_date:"Monthly", monthly_weekday:"Monthly (by weekday)", yearly:"Yearly" };
function recurLabel(recur){
  if(!recur) return "";
  if(recur.freq==="daily" && recur.interval>1) return "Every " + recur.interval + " days";
  if(recur.freq==="weekly" && recur.interval>1) return "Every " + recur.interval + " weeks";
  if(recur.freq==="after_days") return recur.interval + " " + RECUR_LABELS.after_days;
  return RECUR_LABELS[recur.freq] || "Repeats";
}

function collectDescendantIds(items, id){
  var result = [], stack = [id];
  while(stack.length){
    var pid = stack.pop();
    items.forEach(function(it){ if(it.parentId===pid){ result.push(it.id); stack.push(it.id); } });
  }
  return result;
}
function toggleAssignee(list, staffId){
  var idx=-1;
  for(var i=0;i<list.length;i++){ if(list[i].staffId===staffId){ idx=i; break; } }
  if(idx===-1) return list.concat([{staffId:staffId, isLead:list.length===0}]);
  return list.slice(0,idx).concat(list.slice(idx+1));
}
function reduce(state, event){
  var s = cloneState(state);
  var p = event.payload || {};
  switch(event.op){
    case "addItem": s.items = s.items.concat([p.item]); break;
    case "updateItem": s.items = replaceItem(s.items, p.id, function(it){ return Object.assign({}, it, p.patch); }); break;
    case "deleteItem": {
      var toRemove = [p.id].concat(collectDescendantIds(s.items, p.id));
      var setR = {}; toRemove.forEach(function(x){ setR[x]=true; });
      s.items = s.items.filter(function(it){ return !setR[it.id]; });
      break;
    }
    case "deleteItems": {
      var all = [];
      (p.ids||[]).forEach(function(id){ all.push(id); collectDescendantIds(s.items,id).forEach(function(x){ all.push(x); }); });
      var setR2 = {}; all.forEach(function(x){ setR2[x]=true; });
      s.items = s.items.filter(function(it){ return !setR2[it.id]; });
      break;
    }
    case "moveItems": {
      var idSet = {}; (p.ids||[]).forEach(function(x){ idSet[x]=true; });
      s.items = s.items.map(function(it){ return idSet[it.id] ? Object.assign({}, it, {groupId:p.groupId||null}) : it; });
      break;
    }
    case "completeItem": {
      var t = p.completedAt || nowISO();
      var target = s.items.filter(function(it){ return it.id===p.id; })[0];
      s.items = replaceItem(s.items, p.id, function(it){
        return Object.assign({}, it, {status:"done", completedAt:t, firstCompletedAt: it.firstCompletedAt||t});
      });
      if(target && target.recur){
        var nextDue = nextOccurrence(target.recur, target.due, t);
        var clone = Object.assign({}, target, {
          id: uid("i_"), status:"todo", completedAt:null, due: nextDue,
          seriesId: target.seriesId || target.id, createdAt: nowISO(), firstCompletedAt: null
        });
        s.items = s.items.concat([clone]);
      }
      break;
    }
    case "uncompleteItem":
      s.items = replaceItem(s.items, p.id, function(it){ return Object.assign({}, it, {status:"todo", completedAt:null}); });
      break;
    case "addAssignee":
      s.items = replaceItem(s.items, p.id, function(it){
        if((it.assignees||[]).some(function(a){ return a.staffId===p.staffId; })) return it;
        return Object.assign({}, it, {assignees:(it.assignees||[]).concat([{staffId:p.staffId, isLead:(it.assignees||[]).length===0}])});
      });
      break;
    case "removeAssignee":
      s.items = replaceItem(s.items, p.id, function(it){
        return Object.assign({}, it, {assignees:(it.assignees||[]).filter(function(a){ return a.staffId!==p.staffId; })});
      });
      break;
    case "toggleLead":
      s.items = replaceItem(s.items, p.id, function(it){
        return Object.assign({}, it, {assignees:(it.assignees||[]).map(function(a){
          return a.staffId===p.staffId ? Object.assign({},a,{isLead:!a.isLead}) : a;
        })});
      });
      break;
    case "addGroup": s.groups = s.groups.concat([p.group]); break;
    case "updateGroup": s.groups = s.groups.map(function(g){ return g.id===p.id ? Object.assign({},g,p.patch) : g; }); break;
    case "deleteGroup":
      s.groups = s.groups.filter(function(g){ return g.id!==p.id; });
      s.items = s.items.map(function(it){ return it.groupId===p.id ? Object.assign({}, it, {groupId:p.reassignTo||null}) : it; });
      break;
    case "reorderGroups":
      s.groups = s.groups.map(function(g){
        var idx = (p.orderedIds||[]).indexOf(g.id);
        return idx>=0 ? Object.assign({}, g, {order:idx}) : g;
      });
      break;
    case "addPerson": s.people = s.people.concat([p.person]); break;
    case "updatePerson": s.people = s.people.map(function(pp){ return pp.id===p.id ? Object.assign({},pp,p.patch) : pp; }); break;
    case "deletePerson":
      s.people = s.people.filter(function(pp){ return pp.id!==p.id; });
      s.items = s.items.map(function(it){
        if(!(it.assignees||[]).some(function(a){ return a.staffId===p.id; })) return it;
        return Object.assign({}, it, {assignees: it.assignees.filter(function(a){ return a.staffId!==p.id; })});
      });
      break;
    case "setPeople": {
      s.people = p.people;
      var validPeopleIds = {}; s.people.forEach(function(pp){ validPeopleIds[pp.id]=true; });
      s.items = s.items.map(function(it){
        if(!(it.assignees||[]).length) return it;
        var kept = it.assignees.filter(function(a){ return validPeopleIds[a.staffId]; });
        return kept.length===it.assignees.length ? it : Object.assign({}, it, {assignees:kept});
      });
      break;
    }
    case "restoreState": return JSON.parse(JSON.stringify(p.state));
    case "batch": {
      var acc = state;
      (p.ops||[]).forEach(function(sub){ acc = reduce(acc, {op:sub.op, payload:sub.payload}); });
      return acc;
    }
    default: break;
  }
  return s;
}

function dispatch(op, payload, label){
  var event = {id:uid("e"), ts:Date.now(), op:op, payload:payload, label:label||op};
  App.state = reduce(App.state, event);
  App.events.push(event);
  App.redoStack = [];
  bumpVer();
  if(App.events.length > COMPACT_AT){ App.baseState = App.state; App.events = []; }
  Persistence.scheduleSave();
  markDirty(DIRTY_MAP[op] || "all");
  return event;
}
function dispatchBatch(ops, label){
  return dispatch("batch", {ops:ops}, label);
}
function undoLast(){
  if(App.events.length===0) return null;
  var last = App.events.pop();
  App.redoStack.push(last);
  App.state = App.events.reduce(reduce, App.baseState);
  bumpVer();
  Persistence.scheduleSave();
  markDirty("all");
  return last.label;
}
function redoLast(){
  if(App.redoStack.length===0) return null;
  var ev = App.redoStack.pop();
  App.state = reduce(App.state, ev);
  App.events.push(ev);
  bumpVer();
  Persistence.scheduleSave();
  markDirty("all");
  return ev.label;
}

function effectiveStatus(item){
  var kids = childrenOf(item.id);
  if(!kids.length) return item.status;
  var doneCount=0, anyProgress=false;
  kids.forEach(function(k){
    var es = effectiveStatus(k);
    if(es==="done") doneCount++; else if(es==="in_progress") anyProgress=true;
  });
  if(doneCount===kids.length) return "done";
  if(doneCount>0 || anyProgress) return "in_progress";
  return "todo";
}
function effectiveGroupId(item){
  if(item.groupId) return item.groupId;
  if(item.parentId){ var pr = itemById(item.parentId); if(pr) return effectiveGroupId(pr); }
  return null;
}
function isOverdue(item){
  if(!item.due) return false;
  if(effectiveStatus(item)==="done") return false;
  return item.due < todayISO();
}
function isStartHidden(item){ return !!(item.start && item.start > todayISO()); }
function progressOf(id){
  var kids = childrenOf(id);
  if(!kids.length) return null;
  var done = kids.filter(function(k){ return effectiveStatus(k)==="done"; }).length;
  return {done:done, total:kids.length};
}
function completionInstant(item){ return item.completedAt; }

function itemText(item){ return ((item.title||"") + " " + (item.notes||"")).toLowerCase(); }
function queryTodayTop(item){
  return !item.parentId && effectiveStatus(item)!=="done" && !isStartHidden(item) && item.due && item.due<=todayISO();
}
function queryUpcomingTop(item){ return !item.parentId && effectiveStatus(item)!=="done" && item.due && item.due>todayISO(); }
function queryAnytimeTop(item){ return !item.parentId && effectiveStatus(item)!=="done" && !item.due; }
function queryAllTop(item){ return !item.parentId; }
function queryGroupTop(gid){ return function(item){ return !item.parentId && effectiveGroupId(item)===gid; }; }
function hasNoAssignees(it){ return !(it.assignees && it.assignees.length); }
function isUnassignedTop(it){
  if(effectiveStatus(it)==="done") return false;
  if(!hasNoAssignees(it)) return false;
  var kids = childrenOf(it.id);
  if(!kids.length) return true;
  return kids.every(hasNoAssignees);
}
var TRIAGE_FILTERS = {
  critical: function(it){ return it.priority==="critical" && effectiveStatus(it)!=="done"; },
  overdue: function(it){ return isOverdue(it); },
  unassigned: isUnassignedTop
};
function applyCommonFilters(items){
  var q = (App.searchQuery||"").toLowerCase().trim();
  if(q) items = items.filter(function(it){ return itemText(it).indexOf(q)>=0; });
  if(App.statusFilter && App.statusFilter!=="all"){
    var triage = TRIAGE_FILTERS[App.statusFilter];
    items = triage ? items.filter(triage) : items.filter(function(it){ return effectiveStatus(it)===App.statusFilter; });
  }
  if(App.personFilter) items = items.filter(function(it){ return (it.assignees||[]).some(function(a){ return a.staffId===App.personFilter; }); });
  return items;
}
function getListConfig(){

  if(v==="today") return {title:"Today", predicate:queryTodayTop, mode:"today"};
  if(v==="upcoming") return {title:"Upcoming", predicate:queryUpcomingTop, mode:"date-groups"};
  if(v==="anytime") return {title:"Anytime", predicate:queryAnytimeTop, mode:"flat"};
  if(v==="all") return {title:"All", predicate:queryAllTop, mode:"group-groups"};
  if(v.indexOf("group:")===0){
    var gid = v.slice(6); var g = groupById(gid);
    return {title: g?g.name:"Category", predicate:queryGroupTop(gid), mode:"date-groups"};

}

function computeStatStrip(baseItems){
  var open=0, overdue=0, dueToday=0, done=0, critical=0, unassigned=0;
  baseItems.forEach(function(it){
    var st = effectiveStatus(it);
    if(st==="done") done++; else open++;
    if(isOverdue(it)) overdue++;
    if(it.due===todayISO() && st!=="done") dueToday++;
    if(st!=="done" && it.priority==="critical") critical++;
    if(isUnassignedTop(it)) unassigned++;
  });
  return {open:open, overdue:overdue, dueToday:dueToday, done:done, critical:critical, unassigned:unassigned};
}

function wireCategoryDragReorder(container){
  if(container.dataset.dragWired) return;
  container.dataset.dragWired = "1";
  var dragId = null;
  container.addEventListener("dragstart", function(e){
    var row = e.target.closest(".rail-row[data-group-id]");
    if(!row){ e.preventDefault(); return; }
    dragId = row.getAttribute("data-group-id");
    e.dataTransfer.effectAllowed = "move";
    try{ e.dataTransfer.setData("text/plain", dragId); }catch(err){}
    row.classList.add("drag-source");
  });
  container.addEventListener("dragend", function(){
    container.querySelectorAll(".drag-source").forEach(function(r){ r.classList.remove("drag-source"); });
    container.querySelectorAll(".drag-over").forEach(function(r){ r.classList.remove("drag-over"); });
  });
  container.addEventListener("dragover", function(e){
    var row = e.target.closest(".rail-row[data-group-id]");
    if(!row || !dragId) return;
    e.preventDefault();
    row.querySelector(".rail-item").classList.add("drag-over");
  });
  container.addEventListener("dragleave", function(e){
    var row = e.target.closest(".rail-row[data-group-id]");
    if(row) row.querySelector(".rail-item").classList.remove("drag-over");
  });
  container.addEventListener("drop", function(e){
    var row = e.target.closest(".rail-row[data-group-id]");
    if(!row || !dragId) return;
    e.preventDefault();
    var targetId = row.getAttribute("data-group-id");
    row.querySelector(".rail-item").classList.remove("drag-over");
    if(targetId===dragId){ dragId=null; return; }
    var ids = App.state.groups.slice().sort(function(a,b){ return (a.order||0)-(b.order||0); }).map(function(g){ return g.id; });
    var from = ids.indexOf(dragId), to = ids.indexOf(targetId);
    if(from===-1||to===-1){ dragId=null; return; }
    ids.splice(from,1); ids.splice(to,0,dragId);
    dispatch("reorderGroups",{orderedIds:ids},"Reordered categories");
    dragId = null;
  });
}

var teamStatsCache = new Map();
var teamStatsVersion = -1;
function getTeamStats(groupFilter){
  if(teamStatsVersion !== _stateVer){ teamStatsCache = new Map(); teamStatsVersion = _stateVer; }
  var key = groupFilter || "__all__";
  if(teamStatsCache.has(key)) return teamStatsCache.get(key);
  var byStaff = new Map();
  App.state.people.forEach(function(p){
    byStaff.set(p.id, {staffId:p.id, total:0, open:0, inProgress:0, done:0, overdue:0, criticalOpen:0, lead:0, _d:[], sample:0, medianMs:null});
  });
  var today = todayISO();
  App.state.items.forEach(function(it){
    if(!it.assignees || !it.assignees.length) return;
    if(groupFilter && effectiveGroupId(it)!==groupFilter) return;
    var eff = effectiveStatus(it);
    var isDone = eff==="done";
    var overdue = !isDone && !!it.due && it.due<today;
    var crit = !isDone && it.priority==="critical";
    var compMs = isDone && it.completedAt ? Date.parse(it.completedAt) : NaN;
    var createMs = it.createdAt ? Date.parse(it.createdAt) : NaN;
    it.assignees.forEach(function(a){
      var st = byStaff.get(a.staffId);
      if(!st) return;
      st.total++;
      if(isDone) st.done++; else { st.open++; if(eff==="in_progress") st.inProgress++; }
      if(overdue) st.overdue++;
      if(crit) st.criticalOpen++;
      if(a.isLead) st.lead++;
      if(isDone && !isNaN(compMs) && !isNaN(createMs)){
        var d = compMs - createMs;
        if(isFinite(d) && d>=0) st._d.push(d);
      }
    });
  });
  byStaff.forEach(function(st){ st.sample = st._d.length; st.medianMs = st.sample ? median(st._d) : null; st._d = null; });
  teamStatsCache.set(key, byStaff);
  return byStaff;
}

var _scriptLoadPromises = {};
function loadScriptOnce(url){
  if(_scriptLoadPromises[url]) return _scriptLoadPromises[url];
  _scriptLoadPromises[url] = new Promise(function(resolve,reject){
    var s = document.createElement("script");
    s.src = url; s.async = true;
    s.onload = function(){ resolve(); };
    s.onerror = function(){ delete _scriptLoadPromises[url]; reject(new Error("load-failed")); };
    document.head.appendChild(s);
  });
  return _scriptLoadPromises[url];
}

function scanTrailingDate(text){
  var m = /\b(today|tomorrow|mon|tue|wed|thu|fri|sat|sun)(day)?\s*$/i.exec(text.trim());
  if(!m) return null;
  var word = m[1].toLowerCase();
  var due;
  if(word==="today") due = todayISO();
  else if(word==="tomorrow") due = addDaysISO(todayISO(),1);
  else {
    var names=["sun","mon","tue","wed","thu","fri","sat"];
    var targetDow = names.indexOf(word);
    var d = new Date(todayISO()+"T00:00:00");
    var add = (targetDow - d.getDay() + 7) % 7; if(add===0) add=7;
    due = addDaysISO(todayISO(), add);
  }
  var trimmed = text.replace(/\s+$/,"");
  return {due:due, matchStart: trimmed.length - m[0].trim().length - (trimmed.length - m.index - m[0].trim().length >= 0 ? 0 : 0), label: fmtDate(due)};
}

function priorityFromToken(tok){
  if(/^\d+$/.test(tok)){ var n=parseInt(tok,10); return PRIORITIES[clamp(n-1,0,3)]; }
  var lc = tok.toLowerCase();
  return PRIORITIES.indexOf(lc)>=0 ? lc : null;
}
function parseOmniTokens(raw){
  var text = raw;
  var result = {title:"", due:null, priority:null, groupName:null, people:[], recur:null};
  var recurRe = /\bevery\s+(\d+\s+)?(day|days|week|weeks|month|months|year|years|weekday|weekdays)\b/i;
  var m = recurRe.exec(text);
  if(m){
    var n = m[1] ? parseInt(m[1],10) : 1;
    var unit = m[2].toLowerCase();
    if(unit.indexOf("weekday")===0) result.recur = {freq:"weekdays", interval:1};
    else if(unit.indexOf("day")===0) result.recur = {freq:"daily", interval:n};
    else if(unit.indexOf("week")===0) result.recur = {freq:"weekly", interval:n};
    else if(unit.indexOf("month")===0) result.recur = {freq:"monthly_date", interval:n};
    else if(unit.indexOf("year")===0) result.recur = {freq:"yearly", interval:n};
    text = text.slice(0,m.index) + text.slice(m.index+m[0].length);
  } else {
    var afterRe = /\b(\d+)\s+days?\s+after\s+(done|completion|complete)\b/i;
    var m2 = afterRe.exec(text);
    if(m2){ result.recur = {freq:"after_days", interval:parseInt(m2[1],10)}; text = text.slice(0,m2.index) + text.slice(m2.index+m2[0].length); }
  }
  var priRe = /(^|\s)!(\d|low|medium|high|critical)\b/i;
  var m3 = priRe.exec(text);
  if(m3){ result.priority = priorityFromToken(m3[2]); text = text.slice(0,m3.index) + text.slice(m3.index+m3[0].length); }
  var groupRe = /(^|\s)#([a-zA-Z0-9_-]+)/;
  var m5 = groupRe.exec(text);
  if(m5){ result.groupName = m5[2]; text = text.replace(groupRe, "$1"); }
  var personNames = []; var pm2;
  var personRe = /(^|\s)@([a-zA-Z0-9_-]+)/g;
  while((pm2 = personRe.exec(text))){ personNames.push(pm2[2]); }
  if(personNames.length){ result.people = personNames; text = text.replace(/(^|\s)@([a-zA-Z0-9_-]+)/g, "$1"); }
  var wdRe = /\b(mon|tue|wed|thu|fri|sat|sun)(day)?\b/i;
  var todayRe = /\btoday\b/i, tomRe = /\btomorrow\b/i;
  var timeRe = /\b(\d{1,2})(:(\d{2}))?\s?(am|pm)\b/i;
  var dueDate = null;
  if(tomRe.test(text)){ dueDate = addDaysISO(todayISO(),1); text = text.replace(tomRe,""); }
  else if(todayRe.test(text)){ dueDate = todayISO(); text = text.replace(todayRe,""); }
  else {
    var wm = wdRe.exec(text);
    if(wm){
      var names=["sun","mon","tue","wed","thu","fri","sat"];
      var targetDow = names.indexOf(wm[1].toLowerCase());
      var d = new Date(todayISO()+"T00:00:00");
      var add = (targetDow - d.getDay() + 7) % 7; if(add===0) add=7;
      dueDate = addDaysISO(todayISO(), add);
      text = text.slice(0,wm.index) + text.slice(wm.index+wm[0].length);
    }
  }
  var tmatch = timeRe.exec(text);
  if(tmatch){ text = text.slice(0,tmatch.index) + text.slice(tmatch.index+tmatch[0].length); if(!dueDate) dueDate = todayISO(); }
  result.due = dueDate;
  result.title = text.replace(/\s+/g," ").trim();
  return result;
}
function resolveGroupName(name){
  if(!name) return null;
  var existing = App.state.groups.filter(function(g){ return g.name.toLowerCase()===name.toLowerCase(); })[0];

function renderOmniResults(preserveSelection){
  var input = document.getElementById("omni-input");
  var raw = input.value;
  var parsed = parseOmniTokens(raw);
  renderOmniChips(parsed);
  var results = [];
  if(parsed.title){
    results.push({type:"create", label:'Create "'+parsed.title+'"', run:function(keepOpen){
      createItemFromParsed(parsed);
      showToast('Added "'+parsed.title+'"');
      if(keepOpen){ input.value=""; renderOmniResults(); }
      else { closeOmni(); }
    }});
  }
  searchItems(raw, 6).forEach(function(it){
    results.push({type:"item", label:it.title, sub: it.due?fmtDate(it.due):"", run:function(){ closeOmni(); openDetail(it.id); }});
  });
  var cmdQuery = raw.toLowerCase().trim();
  buildCommandList().filter(function(c){ return !cmdQuery || c.label.toLowerCase().indexOf(cmdQuery)>=0; }).forEach(function(c){
    results.push({type:"command", label:c.label, icon:c.icon, run:function(){ closeOmni(); c.run(); }});
  });
  App.omniResults = results;
  if(!preserveSelection) App.omniSelIndex = 0;
  else if(App.omniSelIndex>=results.length) App.omniSelIndex = Math.max(0, results.length-1);
  var wrap = document.getElementById("omni-results");
  wrap.innerHTML = "";
  if(!results.length){
    wrap.appendChild(h("div",{class:"empty-state"},[h("div",{class:"empty-state-sub", text:"Type to add a task or search…"})]));
    return;
  }
  results.forEach(function(r, i){
    var icon = r.type==="create" ? "plus" : r.type==="command" ? (r.icon||"dots") : "circle-check";
    wrap.appendChild(omniRowEl(icon, r.label, r.sub, function(){ r.run(false); }, i===App.omniSelIndex));
  });
}
function wireOmniInput(){
  var input = document.getElementById("omni-input");
  input.addEventListener("input", function(){ renderOmniResults(false); });
  input.addEventListener("keydown", function(e){
    if(e.key==="Escape"){ closeOmni(); return; }
    if(e.key==="ArrowDown"){ e.preventDefault(); App.omniSelIndex = Math.min((App.omniSelIndex||0)+1, ((App.omniResults||[]).length-1)); renderOmniResults(true); return; }
    if(e.key==="ArrowUp"){ e.preventDefault(); App.omniSelIndex = Math.max((App.omniSelIndex||0)-1, 0); renderOmniResults(true); return; }
    if(e.key==="Enter"){
      e.preventDefault();
      var sel = (App.omniResults||[])[App.omniSelIndex||0];
      if(sel) sel.run(e.metaKey||e.ctrlKey);
      return;
    }
  });
}

  if(mod && e.key.toLowerCase()==="k"){ e.preventDefault(); openOmni(); return; }
  if(mod && !e.shiftKey && e.key.toLowerCase()==="z" && !typing){ e.preventDefault(); performUndo(); return; }
  if(mod && (e.key.toLowerCase()==="y" || (e.shiftKey && e.key.toLowerCase()==="z")) && !typing){ e.preventDefault(); performRedo(); return; }
  if(e.key==="Escape"){
    if(document.getElementById("omni-backdrop").classList.contains("show")){ closeOmni(); return; }
    if(document.getElementById("generic-backdrop").classList.contains("show")){ closeGenericModal(); return; }
    if(document.getElementById("create-panel").classList.contains("show")){ closeCreatePanel(); return; }
    if(document.getElementById("detail-panel").classList.contains("show")){ closeDetail(); return; }
    if(Object.keys(App.selected).length){ clearSelection(); return; }
    if(typing) document.activeElement.blur();
    return;
  }
  if(typing) return;
  if(e.key==="n" || e.key==="N"){ e.preventDefault(); openCreatePanel(App.view.indexOf("group:")===0?{groupId:App.view.slice(6)}:{}); return; }
  if(e.key==="/"){ e.preventDefault(); var s=document.getElementById("list-search"); if(s) s.focus(); return; }
  if(App.view!=="team" && (e.key==="j" || e.key==="J" || e.key==="ArrowDown")){ e.preventDefault(); moveRowFocus(1); return; }
  if(App.view!=="team" && (e.key==="k" || e.key==="K" || e.key==="ArrowUp")){ e.preventDefault(); moveRowFocus(-1); return; }
  if(e.key===" "){
    var id = currentFocusedItemId();
    if(id){ e.preventDefault(); var it=itemById(id); if(it){ toggleItemDone(it); renderMainList(); } }
    return;
  }
  if(e.key==="e" || e.key==="E"){
    var id2 = currentFocusedItemId();
    if(id2){ var it2=itemById(id2); if(it2){ cycleStatus(it2); renderMainList(); } }
    return;
  }
  if(e.key==="Enter"){
    var id3 = currentFocusedItemId();
    if(id3){ e.preventDefault(); openDetail(id3); }
    return;
  }
  if(/^[1-6]$/.test(e.key)){
    var map = {"1":"today","2":"upcoming","3":"anytime","4":"all","5":"team","6":"overview"};
    navigateTo(map[e.key]);
    return;
  }
}
function wireGlobalEvents(){
  document.addEventListener("click", function(e){
    var navEl = e.target.closest("[data-nav]");
    if(navEl){ navigateTo(navEl.getAttribute("data-nav")); return; }
    var actionEl = e.target.closest("[data-action]");
    if(actionEl){
      var action = actionEl.getAttribute("data-action");
      if(action==="open-omni") openOmni();
      else if(action==="new-category") newCategoryFlow();
      else if(action==="open-settings") openSettingsModal();
      else if(action==="open-create") openCreatePanel(App.view.indexOf("group:")===0?{groupId:App.view.slice(6)}:{});
      else if(action==="close-create") closeCreatePanel();
      else if(action==="close-detail") closeDetail();
      else if(action==="delete-item") deleteCurrentItem();
      return;
    }
  });
  document.getElementById("backdrop").addEventListener("click", function(){ closeDetail(); closeCreatePanel(); });
  document.getElementById("omni-backdrop").addEventListener("click", function(e){ if(e.target===this) closeOmni(); });
  document.getElementById("generic-backdrop").addEventListener("click", function(e){ if(e.target===this) closeGenericModal(); });
  document.querySelectorAll("#list-viewswitch button").forEach(function(b){
    b.addEventListener("click", function(){ App.listRenderAs = b.getAttribute("data-render"); renderMainList(); });
  });
  document.getElementById("density-toggle-btn").addEventListener("click", cycleDensity);
  document.getElementById("theme-toggle-btn").addEventListener("click", cycleTheme);
  document.getElementById("team-theme-toggle-btn").addEventListener("click", cycleTheme);
  document.getElementById("team-group-filter").addEventListener("click", function(e){
    e.stopPropagation();
    var opts = [{value:"", label:"All categories"}].concat(App.state.groups.map(function(g){ return {value:g.id, label:g.name, color:g.color}; }));
    openSelectPopover(e.currentTarget, opts, App.teamGroupFilter||"", function(v){ App.teamGroupFilter = v||null; renderTeam(); });
  });
  document.getElementById("team-view-cards-btn").addEventListener("click", function(){ App.teamView="cards"; renderTeam(); });
  document.getElementById("team-view-table-btn").addEventListener("click", function(){ App.teamView="table"; renderTeam(); });
  document.getElementById("list-search").addEventListener("input", function(e){ App.searchQuery = e.target.value; renderMainList(); });
  wireOmniInput();
  document.addEventListener("keydown", onGlobalKeydown);
  window.addEventListener("visibilitychange", function(){ if(document.visibilityState==="hidden") Persistence.saveNow(); });
  window.addEventListener("pagehide", function(){ Persistence.saveNow(); });
}
function bootstrap(){
  applyTheme(currentThemeMode());
  applyDensity(currentDensity());
  try{ var savedView = localStorage.getItem(VIEW_KEY); if(savedView) App.view = savedView; }catch(e){}
  Promise.all([Vault.init(), Persistence.loadInitial()]).then(function(results){
    var loaded = results[1];
    if(loaded && loaded.baseState){ App.baseState = loaded.baseState; App.events = loaded.events || []; }
    else { App.baseState = emptyState(); App.events = []; }
    App.state = App.events.reduce(reduce, App.baseState);
    bumpVer();
    wireGlobalEvents();
    document.getElementById("view-list").classList.toggle("active", App.view!=="team" && App.view!=="overview");
    document.getElementById("view-team").classList.toggle("active", App.view==="team");
    document.getElementById("view-overview").classList.toggle("active", App.view==="overview");
    if(App.view==="team") renderTeam(); else if(App.view==="overview") renderOverview(); else renderMainList();
    renderRail();
    renderStatus();
    Persistence.saveNow();
  }).catch(function(){
    App.baseState = emptyState(); App.events = [];
    App.state = App.baseState;
    bumpVer();
    wireGlobalEvents();
    renderMainList();
    renderRail();
  });
}
bootstrap();

})();
</script>
</body>
</html>
