<!DOCTYPE html>
<html lang="en" dir="ltr">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Gov To Do</title>
<script src="https://cdn.sheetjs.com/xlsx-0.20.3/package/dist/xlsx.full.min.js"></script>
<script src="https://cdn.jsdelivr.net/npm/chart.js@4.5.1/dist/chart.umd.min.js"></script>
<style>
  :root{
    --bg: #F7F5F1;
    --bg-raised: #FFFFFF;
    --surface-2: #FBFAF7;
    --surface-sunken: #F1EEE9;
    --ink: #1C1A18;
    --ink-soft: #6B655E;
    --ink-faint: #A29B93;
    --hairline: rgba(28,26,24,.075);
    --hairline-strong: rgba(28,26,24,.12);
    --line: var(--hairline);
    --line-soft: var(--surface-2);
    --accent: #9A5B4C;
    --accent-ink: #844B3E;
    --accent-soft: #F4EAE5;
    --accent-ring: rgba(154,91,76,.28);
    --brass: #5B7C99;
    --brass-ink: #3F5A73;
    --brass-soft: #E7EEF3;
    --danger: #AF4A42;
    --danger-soft: #F8E9E7;
    --warn: #5B7C99;
    --warn-soft: #E7EEF3;
    --ok: #5E7D63;
    --ok-soft: #E9F0EA;
    --slate: #5F6E78;
    --slate-soft: #EBEFF1;
    --radius-xs: 8px;
    --radius-sm: 12px;
    --radius: 16px;
    --radius-lg: 22px;
    --shadow-sm: 0 0 0 0.5px var(--hairline), 0 1px 2px rgba(28,26,24,.04);
    --shadow-raised: 0 0 0 0.5px var(--hairline), 0 6px 20px rgba(28,26,24,.07);
    --shadow-md: 0 24px 64px rgba(28,26,24,.18);
    --ease-out: cubic-bezier(.32,.72,0,1);
    --font-ui: -apple-system, BlinkMacSystemFont, "SF Pro Text", "SF Arabic", "IBM Plex Sans Arabic", "Segoe UI", system-ui, sans-serif;
    --font-mono-sys: ui-monospace, SFMono-Regular, Menlo, Consolas, monospace;
  }
  @media (prefers-color-scheme: dark){
    :root:not([data-theme="light"]){
      --bg: #121110; --bg-raised: #1B1A18; --surface-2: #222120; --surface-sunken: #0E0D0C;
      --hairline: rgba(255,255,255,.08); --hairline-strong: rgba(255,255,255,.14);
      --ink: #F3F0EB; --ink-soft: #A8A29A; --ink-faint: #726C65;
      --accent: #C4826F; --accent-ink: #D49781; --accent-soft: rgba(196,130,111,.16); --accent-ring: rgba(196,130,111,.35);
      --danger: #D2716A; --danger-soft: rgba(210,113,106,.16);
      --ok: #8AA98F; --ok-soft: rgba(138,169,143,.16);
      --brass: #7FA0BE; --warn: #7FA0BE; --brass-soft: rgba(127,160,190,.16); --warn-soft: rgba(127,160,190,.16);
      --slate: #8A9AA5; --slate-soft: rgba(138,154,165,.14);
      --shadow-sm: 0 0 0 0.5px var(--hairline), 0 1px 2px rgba(0,0,0,.2);
      --shadow-raised: 0 0 0 0.5px var(--hairline), 0 6px 20px rgba(0,0,0,.35);
      --shadow-md: 0 24px 64px rgba(0,0,0,.5);
    }
  }
    :root[data-theme="dark"]{
    --bg: #121110; --bg-raised: #1B1A18; --surface-2: #222120; --surface-sunken: #0E0D0C;
    --hairline: rgba(255,255,255,.08); --hairline-strong: rgba(255,255,255,.14);
    --ink: #F3F0EB; --ink-soft: #A8A29A; --ink-faint: #726C65;
    --accent: #C4826F; --accent-ink: #D49781; --accent-soft: rgba(196,130,111,.16); --accent-ring: rgba(196,130,111,.35);
    --danger: #D2716A; --danger-soft: rgba(210,113,106,.16);
    --ok: #8AA98F; --ok-soft: rgba(138,169,143,.16);
    --brass: #7FA0BE; --warn: #7FA0BE; --brass-soft: rgba(127,160,190,.16); --warn-soft: rgba(127,160,190,.16);
    --slate: #8A9AA5; --slate-soft: rgba(138,154,165,.14);
    --shadow-sm: 0 0 0 0.5px var(--hairline), 0 1px 2px rgba(0,0,0,.2);
    --shadow-raised: 0 0 0 0.5px var(--hairline), 0 6px 20px rgba(0,0,0,.35);
    --shadow-md: 0 24px 64px rgba(0,0,0,.5);
  }
  body{ transition: background-color .18s var(--ease-out), color .18s var(--ease-out); }
  *{ box-sizing: border-box; }
  html,body{ height:100%; }
  body{
    margin:0; background:var(--bg); color:var(--ink); font-family:var(--font-ui);
    font-size:14px; line-height:1.45; -webkit-font-smoothing:antialiased; position:relative;
    font-variant-numeric: tabular-nums;
  }
  svg{ stroke-linecap:round; stroke-linejoin:round; }
  button, input, select, textarea{ font-family:inherit; font-size:inherit; color:inherit; }
  button{ cursor:pointer; }
  ::selection{ background:var(--accent-soft); }
  :focus-visible{ outline:none; box-shadow:0 0 0 3px var(--accent-ring); border-radius:4px; }
  [dir="auto"]{ unicode-bidi: plaintext; }
  @media (prefers-reduced-motion: reduce){ *{ animation-duration:0.001ms !important; transition-duration:0.001ms !important; } }

    .shell{ position:relative; z-index:1; display:flex; min-height:100vh; }
  .rail{
    width:196px; flex-shrink:0; padding:18px 10px;
    display:flex; flex-direction:column; gap:3px; position:sticky; top:0; height:100vh; overflow-y:auto;
    border-inline-end:1px solid var(--hairline);
    background:color-mix(in srgb, var(--bg) 72%, transparent);
    -webkit-backdrop-filter:saturate(180%) blur(24px); backdrop-filter:saturate(180%) blur(24px);
  }
  .rail-brand{ display:flex; align-items:center; gap:9px; padding:2px 8px 18px; }
  .rail-brand-mark{ width:32px; height:32px; border-radius:11px; background:var(--accent); color:#fff; display:flex; align-items:center; justify-content:center; font-size:16px; flex-shrink:0; }
  .rail-brand-text{ font-size:13px; font-weight:700; line-height:1.2; }
  .rail-brand-sub{ font-size:11px; color:var(--ink-faint); }
  .rail-tab{
    display:flex; align-items:center; gap:8px; width:100%; text-align:start; border:none;
    background:transparent; color:var(--ink-soft); padding:8px 10px; border-radius:var(--radius-sm);
    font-size:12.5px; font-weight:500;
  }
  .rail-tab:hover{ background:var(--line-soft); color:var(--ink); }
  .rail-tab.active{ background:var(--accent-soft); color:var(--accent-ink); font-weight:600; }
  .rail-dot{ width:8px; height:8px; border-radius:50%; flex-shrink:0; }
  .rail-label{ flex:1; overflow:hidden; text-overflow:ellipsis; white-space:nowrap; }
  .rail-count{ font-size:10px; color:var(--ink-faint); }
  .rail-tab.active .rail-count{ color:var(--accent-ink); opacity:0.75; }
  .rail-sep{ height:1px; background:var(--line); margin:8px 10px; }
  .rail-add{ border:1.5px dashed var(--line); background:transparent; color:var(--ink-faint); border-radius:20px; padding:7px 10px; font-size:12px; margin-top:6px; }
  .rail-add:hover{ border-color:var(--brass); color:var(--brass-ink); }
  .rail-tab-wrap{ display:flex; align-items:center; position:relative; border-radius:var(--radius-sm); }
  .rail-tab-wrap .rail-tab{ flex:1; min-width:0; }
  .rail-tab-wrap.drag-source{ opacity:0.5; }
  .rail-tab-menu-btn{
    flex-shrink:0; width:22px; height:22px; display:flex; align-items:center; justify-content:center;
    border:none; background:transparent; color:var(--ink-faint); border-radius:7px; font-size:14px; line-height:1;
    opacity:0; transition:opacity .12s var(--ease-out);
  }
  .rail-tab-wrap:hover .rail-tab-menu-btn, .rail-tab-menu-btn.menu-open{ opacity:1; }
  .rail-tab-menu-btn:hover{ background:var(--line-soft); color:var(--ink); }
  .rail-rename-row{ display:flex; align-items:center; gap:8px; width:100%; padding:8px 10px; }
  .rail-inline-rename{ font-size:12.5px; }
  .color-swatch-grid{ display:grid; grid-template-columns:repeat(7,1fr); gap:6px; padding:4px; }
  .color-swatch-btn{ width:22px; height:22px; border-radius:50%; border:1.5px solid transparent; flex-shrink:0; }
  .color-swatch-btn:hover{ border-color:var(--ink); transform:scale(1.08); }

  .main-col{ flex:1; min-width:0; padding:20px 28px 60px; }
  .pane{ display:none; }
  .pane.active{ display:block; }
  #pane-list{ max-width:780px; margin-inline:auto; }
  #pane-overview{ max-width:1100px; margin-inline:auto; }
  #pane-team{ max-width:1100px; margin-inline:auto; }

  .topbar{ display:flex; align-items:center; gap:10px; margin-bottom:16px; flex-wrap:wrap; }
  .search-wrap{ position:relative; display:flex; align-items:center; }
  .search-wrap svg{ position:absolute; inset-inline-start:10px; pointer-events:none; opacity:0.45; }
  #search{ border:1px solid var(--line); background:var(--bg-raised); padding-block:8px; padding-inline-start:32px; padding-inline-end:12px; border-radius:10px; width:200px; }
  .topbar-actions{ display:flex; align-items:center; gap:8px; margin-inline-start:auto; flex-wrap:wrap; }

  .btn-primary{ background:var(--accent); color:#fff; border:none; padding:8px 14px; border-radius:11px; font-weight:600; display:inline-flex; align-items:center; gap:6px; }
  .btn-primary:hover{ background:var(--accent-ink); }
  .btn-ghost{ background:transparent; border:1px solid var(--line); color:var(--ink-soft); padding:7px 12px; border-radius:11px; font-weight:500; display:inline-flex; align-items:center; gap:6px; }
  .btn-ghost:hover{ border-color:var(--ink-faint); color:var(--ink); }
  .btn-ghost.small{ padding:5px 10px; font-size:12px; }
  .settings-panel{ background:var(--bg-raised); border-radius:var(--radius-sm); box-shadow:var(--shadow-md); min-width:220px; padding:6px; }
  .settings-row{ display:flex; align-items:center; gap:8px; width:100%; text-align:start; border:none; background:transparent; padding:9px 10px; border-radius:9px; font-size:13px; color:var(--ink); }
  .settings-row:hover{ background:var(--surface-2); }
  .settings-row-sub{ margin-inline-start:auto; font-size:11.5px; color:var(--ink-faint); }
  .settings-sep{ height:1px; background:var(--hairline); margin:6px 4px; }
  .sync-dot-inline{ width:7px; height:7px; border-radius:50%; background:var(--ink-faint); flex-shrink:0; }
  .sync-dot-inline.connected{ background:var(--ok); }

    .stat-strip{ display:flex; gap:10px; margin:2px 0 16px; flex-wrap:wrap; }
  .stat-pill{ background:var(--bg-raised); border:1px solid var(--line); border-radius:var(--radius-sm); padding:10px 16px; display:flex; align-items:baseline; gap:8px; cursor:pointer; }
  .stat-pill:hover{ border-color:var(--ink-faint); }
  .stat-pill .n{ font-size:19px; font-weight:600; }
  .stat-pill .l{ font-size:11.5px; color:var(--ink-faint); }
  .stat-pill.warn .n{ color:var(--danger); }

    .filter-chips{ display:flex; gap:6px; margin:0 0 14px; flex-wrap:wrap; }
  .chip{ border:1px solid var(--line); background:var(--bg-raised); border-radius:20px; padding:6px 13px; font-size:12.5px; font-weight:500; color:var(--ink-soft); }
  .chip.active{ background:var(--accent); color:#fff; border-color:var(--accent); }

    .quick-add-row{ display:flex; align-items:center; gap:10px; padding:9px 12px; border:1.5px dashed var(--line); border-radius:var(--radius-sm); margin-bottom:12px; }
  .quick-add-row:focus-within{ border-color:var(--accent); border-style:solid; }
  .quick-add-plus{ color:var(--ink-faint); font-size:16px; font-weight:600; flex-shrink:0; line-height:1; }
  #quick-add-input{ border:none; background:transparent; flex:1; font-size:13px; padding:2px 0; }
  #quick-add-input::placeholder{ color:var(--ink-faint); }
  .section-group{ margin-bottom:22px; }
  .section-header{ display:flex; align-items:center; gap:8px; font-size:13px; font-weight:600; color:var(--ink-soft); margin:0 0 8px 4px; }
  .section-count{ color:var(--ink-faint); font-weight:500; }
  .row-card{ background:var(--bg-raised); border-radius:var(--radius); box-shadow:var(--shadow-sm); overflow:hidden; }
  .row-wrap:last-child > .row{ border-bottom:none; }
  .row{ display:flex; align-items:center; gap:10px; padding:12px 16px; min-height:46px; cursor:pointer; border-bottom:1px solid var(--hairline); transition:background .12s var(--ease-out); }
  .row:hover{ background:var(--surface-2); --roundel-ring:var(--surface-2); }
  .row.selected{ background:var(--accent-soft); --roundel-ring:var(--accent-soft); }
  .rail-tab.drag-over{ box-shadow:0 0 0 2px var(--accent) inset; }

  .bulk-bar{
    position:fixed; bottom:28px; left:50%; transform:translate(-50%,16px); z-index:75;
    background:rgba(28,26,24,.92); color:#fff; padding:9px 14px; border-radius:999px; font-size:13px;
    -webkit-backdrop-filter:blur(12px); backdrop-filter:blur(12px); box-shadow:var(--shadow-md);
    display:flex; align-items:center; gap:10px; opacity:0; pointer-events:none;
    transition:opacity .2s var(--ease-out), transform .2s var(--ease-out);
  }
  .bulk-bar.show{ opacity:1; pointer-events:auto; transform:translate(-50%,0); }
  .bulk-count{ font-weight:600; padding-inline-end:4px; }
  .bulk-bar button{ border:none; background:rgba(255,255,255,.12); color:#fff; padding:6px 12px; border-radius:999px; font-size:12.5px; font-weight:500; }
  .bulk-bar button:hover{ background:rgba(255,255,255,.2); }
  .row.branch-row-list{ padding-inline-start:46px; min-height:40px; }

  .checkbox{
    width:20px; height:20px; border-radius:50%; flex-shrink:0; padding:0; margin:0; position:relative;
    border:1.5px solid var(--ink-faint); background:transparent; display:flex; align-items:center; justify-content:center;
    transition:background .16s var(--ease-out), border-color .16s var(--ease-out), transform .12s var(--ease-out);
  }
  .checkbox:hover{ border-color:var(--accent); }
  .checkbox:active{ transform:scale(.88); }
  .checkbox.checked{ background:var(--accent); border-color:var(--accent); }
  .checkbox svg{ width:12px; height:12px; stroke:#fff; stroke-width:3; fill:none; stroke-dasharray:20; stroke-dashoffset:20; transition:stroke-dashoffset .24s var(--ease-out); }
  .checkbox.checked svg{ stroke-dashoffset:0; }

  .disclose-btn{ width:20px; height:20px; flex-shrink:0; border:none; background:transparent; color:var(--ink-faint); display:flex; align-items:center; justify-content:center; padding:0; position:relative; transition:transform .16s var(--ease-out); }
  .disclose-btn.expanded{ transform:rotate(90deg); }
  .progress-ring{ width:20px; height:20px; border-radius:50%; flex-shrink:0; position:relative; }
  .progress-ring::after{ content:""; position:absolute; inset:3px; border-radius:50%; background:var(--roundel-ring, var(--bg-raised)); }

  .row-title{ flex:1; min-width:0; font-size:15px; overflow:hidden; text-overflow:ellipsis; white-space:nowrap; transition:color .16s var(--ease-out); }
  .row-title.small{ font-size:14px; }
  .row-title.done{ color:var(--ink-faint); text-decoration:line-through; }
  .priority-pill{ font-size:11px; font-weight:600; padding:2px 9px; border-radius:999px; flex-shrink:0; }
  .priority-pill.high{ background:var(--warn-soft); color:var(--warn); }
  .priority-pill.critical{ background:var(--danger-soft); color:var(--danger); }
  .row-date{ font-size:12.5px; color:var(--ink-faint); flex-shrink:0; }
  .row-date.overdue{ color:var(--danger); font-weight:600; }

  .children-wrap{ display:grid; grid-template-rows:0fr; transition:grid-template-rows .28s var(--ease-out); }
  .children-wrap.expanded{ grid-template-rows:1fr; }
  .children-wrap-inner{ overflow:hidden; min-height:0; }

  .avatars{ display:flex; flex-shrink:0; }
  .roundel{ position:relative; width:22px; height:22px; border-radius:50%; color:#fff; font-size:10.5px; font-weight:600; display:flex; align-items:center; justify-content:center; border:2px solid var(--roundel-ring, var(--bg-raised)); margin-inline-start:-7px; flex-shrink:0; }
  .roundel:first-child{ margin-inline-start:0; }
  .roundel.small{ width:18px; height:18px; font-size:9px; border-width:1.5px; margin-inline-start:-6px; }
  .lead-badge{ position:absolute; bottom:-2px; inset-inline-end:-2px; width:7px; height:7px; border-radius:50%; background:var(--brass); box-shadow:0 0 0 1.5px var(--bg-raised); }

  .tag{ display:inline-flex; align-items:center; font-size:11px; font-weight:600; padding:3px 9px; border-radius:999px; white-space:nowrap; flex-shrink:0; }
  .tag-medium{ background:var(--slate-soft); color:var(--slate); }
  .tag-high{ background:var(--warn-soft); color:var(--warn); }
  .tag-critical{ background:var(--danger-soft); color:var(--danger); }
  .tag-todo{ background:var(--surface-2); color:var(--ink-soft); }
  .tag-in_progress{ background:var(--warn-soft); color:var(--warn); }
  .tag-done{ background:var(--ok-soft); color:var(--ok); }
  .tag-group{ background:var(--accent-soft); color:var(--accent-ink); }
  .empty-col{ font-size:13px; color:var(--ink-faint); text-align:center; }

    .chart-grid{ display:grid; grid-template-columns:1fr 1fr; gap:16px; }
  .chart-card{ background:var(--bg-raised); border:1px solid var(--line); border-radius:var(--radius); padding:16px; }
  .chart-card.wide{ grid-column:1 / -1; }
  .chart-card h3{ margin:0 0 12px; font-size:13px; font-weight:600; color:var(--ink-faint); }
  .chart-card-body{ height:220px; position:relative; }
  .chart-card.wide .chart-card-body{ height:260px; }

    .staff-grid{ display:grid; grid-template-columns:repeat(auto-fill, minmax(250px,1fr)); gap:14px; }
  .staff-card{ background:var(--bg-raised); border:1px solid var(--line); border-radius:var(--radius); padding:16px; position:relative; }
  .staff-card-head{ display:flex; align-items:center; gap:10px; }
  .staff-name{ font-weight:600; font-size:14px; }
  .staff-dept{ font-size:11px; color:var(--ink-faint); }
  .staff-remove{ position:absolute; top:12px; inset-inline-end:12px; border:none; background:transparent; color:var(--ink-faint); font-size:14px; }
  .staff-remove:hover{ color:var(--danger); }
  .cat-manage-row{ display:flex; align-items:center; gap:10px; padding:9px 12px; margin-bottom:8px; }
  .cat-manage-row.drag-over{ box-shadow:0 0 0 2px var(--accent) inset; }
  .cat-manage-row.drag-source{ opacity:0.5; }
  .cat-drag-handle{ cursor:grab; color:var(--ink-faint); font-size:13px; flex-shrink:0; letter-spacing:-2px; }
  .cat-swatch-btn{ width:20px; height:20px; border-radius:50%; border:none; flex-shrink:0; transition:transform .12s var(--ease-out); }
  .cat-swatch-btn:hover{ transform:scale(1.12); }
  .cat-manage-name{ flex:1; min-width:0; overflow:hidden; text-overflow:ellipsis; white-space:nowrap; font-weight:600; font-size:13px; }
  .cat-manage-count{ font-size:11.5px; color:var(--ink-faint); flex-shrink:0; }
  .staff-stats{ display:flex; gap:16px; margin:14px 0 8px; }
  .stat-num{ font-size:19px; font-weight:600; }
  .stat-num.danger{ color:var(--danger); }
  .stat-label{ font-size:12px; color:var(--ink-faint); }
  .progress-bar{ height:5px; border-radius:4px; background:var(--line-soft); overflow:hidden; margin:6px 0 12px; }
  .progress-fill{ height:100%; background:var(--ok); }
  .staff-items{ display:flex; flex-direction:column; gap:5px; max-height:110px; overflow-y:auto; }
  .staff-item-row{ font-size:11.5px; color:var(--ink-soft); display:flex; gap:6px; align-items:center; }
  .status-dot-mini{ width:7px; height:7px; border-radius:50%; flex-shrink:0; background:var(--ink-faint); }
  .status-dot-mini.in_progress{ background:var(--warn); }
  .status-dot-mini.done{ background:var(--ok); }
  .add-tile{ background:transparent; border:1.5px dashed var(--line); border-radius:var(--radius); display:flex; align-items:center; justify-content:center; min-height:120px; color:var(--ink-faint); font-size:13px; font-weight:500; }
  .add-tile:hover{ border-color:var(--brass); color:var(--brass-ink); }
  .mini-form{ background:var(--bg-raised); border:1px solid var(--line); border-radius:var(--radius); padding:16px; }
  .mini-form input{ width:100%; border:1px solid var(--line); border-radius:10px; padding:7px 9px; margin-bottom:8px; background:var(--bg); }
  .mini-form-foot{ display:flex; gap:8px; justify-content:flex-end; }

    .backdrop{ position:fixed; inset:0; background:rgba(28,26,24,0.28); -webkit-backdrop-filter:blur(2px); backdrop-filter:blur(2px); opacity:0; pointer-events:none; transition:opacity 0.2s var(--ease-out); z-index:40; }
  .backdrop.show{ opacity:1; pointer-events:auto; }
  .detail-panel{ position:fixed; top:0; inset-inline-end:0; height:100%; width:460px; max-width:92vw; background:var(--bg-raised); box-shadow:var(--shadow-md); border-radius:var(--radius-lg) 0 0 var(--radius-lg); transform:translateX(100%); transition:transform 0.34s var(--ease-out); z-index:41; overflow-y:auto; }
  .detail-panel.show{ transform:translateX(0); }
  .detail-content{ padding:20px 22px 60px; }
  .detail-close{ border:none; background:var(--line-soft); width:28px; height:28px; border-radius:11px; display:flex; align-items:center; justify-content:center; float:inline-end; }
  .detail-close:hover{ background:var(--line); }
  .parent-link{ font-size:11.5px; color:var(--brass-ink); background:var(--brass-soft); display:inline-block; padding:4px 10px; border-radius:20px; margin-bottom:12px; cursor:pointer; }
  .field{ margin-bottom:16px; }

  function fmtDate(iso){

    r = Math.min(255, Math.round(r + (255-r)*pct));
    g = Math.min(255, Math.round(g + (255-g)*pct));

  function dateSection(item){
    if(effectiveStatus(item)==="done") return "done";
    if(!item.date) return "nodate";
    var today = todayISO();
    if(item.date < today) return "overdue";
    if(item.date === today) return "today";
    var diffDays = Math.round((new Date(item.date+"T00:00:00") - new Date(today+"T00:00:00")) / 86400000);
    if(diffDays === 1) return "tomorrow";
    if(diffDays <= 7) return "week";
    return "later";
  }
  function relDate(item){
    if(!item.date) return "";

    if(item.date === today) return "Today";
    var diffDays = Math.round((new Date(item.date+"T00:00:00") - new Date(today+"T00:00:00")) / 86400000);
    if(diffDays === 1) return "Tomorrow";
    if(diffDays === -1) return "Yesterday";
    if(diffDays < 0) return Math.abs(diffDays) + "d overdue";
    if(diffDays > 1 && diffDays <= 7) return "in " + diffDays + "d";
    return fmtDate(item.date);
  }

  function closePopover(){

  function positionPopover(triggerEl, width){
    var margin = 8;
    var w = Math.min(width||240, window.innerWidth - margin*2);
    var r = triggerEl.getBoundingClientRect();
    var panelH = popoverRoot.scrollHeight;

    var left = r.left;
    var maxLeft = window.innerWidth - w - margin;
    left = Math.min(left, maxLeft);
    left = Math.max(margin, left);

    var top = r.bottom + 6;
    var fitsBelow = (top + panelH) <= (window.innerHeight - margin);
    if(!fitsBelow){
      var above = r.top - 6 - panelH;
      top = above >= margin ? above : Math.max(margin, window.innerHeight - margin - panelH);
    }
    popoverRoot.style.left = left + "px";
    popoverRoot.style.top = top + "px";
    window.addEventListener("scroll", closePopoverOnViewportChange, true);
    window.addEventListener("resize", closePopoverOnViewportChange);
  }

  function applyCSelect(type, itemId, value, triggerEl){
    if(type==="group") Store.updateItem(itemId, {groupId:value || null});
    else if(type==="status") Store.updateItem(itemId, {status:value});
    else if(type==="priority") Store.updateItem(itemId, {priority:value});
    else if(type==="addAssignee"){ if(value) Store.addAssignee(itemId, value); }

    if(type==="addAssignee"){ if(currentItemId) buildPanel(currentItemId); }
    else if(triggerEl){
      triggerEl.setAttribute("data-value", value);
      var lbl = triggerEl.querySelector(".cselect-label");
      if(lbl) lbl.textContent = cselectLabelFor(type, itemId, value);
    }
    renderAll();
  }

  function openDatePickerFor(triggerEl){
    var itemId = triggerEl.getAttribute("data-datepicker");
    var iso = triggerEl.getAttribute("data-value");
    var base = iso ? new Date(iso+"T00:00:00") : new Date();
    dpYear = base.getFullYear(); dpMonth = base.getMonth();
    renderDatePickerPanel(triggerEl, itemId, iso);
    popoverRoot.classList.add("show");
    positionPopover(triggerEl, 230);
    openTrigger = triggerEl;
  }

  function renderDatePickerPanel(triggerEl, itemId, selectedIso){
    var monthNames = ["January","February","March","April","May","June","July","August","September","October","November","December"];
    var startWeekday = new Date(dpYear, dpMonth, 1).getDay();
    var daysInMonth = new Date(dpYear, dpMonth+1, 0).getDate();
    var todayIso = todayISO();
    var pad2 = function(n){ return n<10 ? "0"+n : ""+n; };

    var html = '<div class="datepicker-panel">';
    html += '<div class="dp-head"><button type="button" class="dp-nav" data-dp-nav="-1">&#8249;</button><span class="dp-month-label">'+monthNames[dpMonth]+' '+dpYear+'</span><button type="button" class="dp-nav" data-dp-nav="1">&#8250;</button></div>';
    html += '<div class="dp-grid dp-grid-head">'+["S","M","T","W","T","F","S"].map(function(d){ return '<span>'+d+'</span>'; }).join("")+'</div>';
    html += '<div class="dp-grid">';
    for(var i=0;i<startWeekday;i++) html += '<span class="dp-cell empty"></span>';
    for(var d=1; d<=daysInMonth; d++){
      var iso = dpYear+"-"+pad2(dpMonth+1)+"-"+pad2(d);
      var cls = "dp-cell" + (iso===selectedIso?" selected":"") + (iso===todayIso?" today":"");
      html += '<button type="button" class="'+cls+'" data-dp-day="'+iso+'">'+d+'</button>';
    }
    html += '</div>';
    html += '<button type="button" class="dp-clear" data-dp-clear="1">Clear date</button>';
    html += '</div>';
    popoverRoot.innerHTML = html;

    popoverRoot.querySelectorAll("[data-dp-nav]").forEach(function(btn){
      btn.onclick = function(){
        dpMonth += parseInt(btn.getAttribute("data-dp-nav"),10);
        if(dpMonth<0){ dpMonth=11; dpYear--; }
        if(dpMonth>11){ dpMonth=0; dpYear++; }
        renderDatePickerPanel(triggerEl, itemId, selectedIso);
      };
    });
    popoverRoot.querySelectorAll("[data-dp-day]").forEach(function(btn){
      btn.onclick = function(){
        var iso = btn.getAttribute("data-dp-day");
        Store.updateItem(itemId, {date:iso});
        triggerEl.setAttribute("data-value", iso);
        var lbl = triggerEl.querySelector(".cselect-label"); if(lbl) lbl.textContent = fmtDate(iso);
        closePopover();
        renderAll();
      };
    });
    var clearBtn = popoverRoot.querySelector("[data-dp-clear]");
    clearBtn.onclick = function(){
      Store.updateItem(itemId, {date:""});
      triggerEl.setAttribute("data-value", "");
      var lbl = triggerEl.querySelector(".cselect-label"); if(lbl) lbl.textContent = "Set date";
      closePopover();
      renderAll();
    };
  }

  document.addEventListener("click", function(e){
    var cselectTrigger = e.target.closest("[data-cselect]");
    if(cselectTrigger){ openCSelectFor(cselectTrigger); return; }
    var dpTrigger = e.target.closest("[data-datepicker]");
    if(dpTrigger){ openDatePickerFor(dpTrigger); return; }
    if(!popoverRoot.classList.contains("show")) return;
    var path = e.composedPath ? e.composedPath() : [e.target];
    if(path.indexOf(popoverRoot) !== -1) return;
    if(openTrigger && path.indexOf(openTrigger) !== -1) return;
    closePopover();
  });

  function dismissExistingToasts(){
    document.querySelectorAll(".toast").forEach(function(t){ t.remove(); });
  }
  function showToast(message, kind){
    dismissExistingToasts();
    var el = document.createElement("div");
    el.className = "toast" + (kind?(" "+kind):"");
    el.setAttribute("role", "status");
    el.setAttribute("aria-live", "polite");
    el.textContent = message;
    document.body.appendChild(el);
    setTimeout(function(){ el.classList.add("show"); }, 10);
    setTimeout(function(){
      el.classList.remove("show");
      setTimeout(function(){ el.remove(); }, 250);
    }, 3200);
  }

  function showUndoToast(message){
    dismissExistingToasts();
    var el = document.createElement("div");
    el.className = "toast";
    el.setAttribute("role", "status");
    el.setAttribute("aria-live", "polite");
    el.innerHTML = '<span>'+esc(message)+'</span><button type="button" class="toast-undo-btn">Undo</button>';
    document.body.appendChild(el);
    var undone = false;
    function dismiss(){ el.classList.remove("show"); setTimeout(function(){ el.remove(); }, 250); }
    el.querySelector(".toast-undo-btn").onclick = function(){
      undone = true;
      Store.undo();
      renderAll();
      dismiss();
    };
    setTimeout(function(){ el.classList.add("show"); }, 10);
    setTimeout(function(){ if(!undone) dismiss(); }, 5000);
  }

  var createDraft = null;
  var createPanelEl = document.getElementById("create-panel-el");
  var WEEKDAYS_EN = ["sunday","monday","tuesday","wednesday","thursday","friday","saturday"];
  var WEEKDAYS_EN_LABEL = ["Sunday","Monday","Tuesday","Wednesday","Thursday","Friday","Saturday"];
  var WEEKDAYS_AR = ["الأحد","الاثنين","الثلاثاء","الأربعاء","الخميس","الجمعة","السبت"];

  function tomorrowISO(){ var d=new Date(); d.setDate(d.getDate()+1); return localISO(d); }
  function nextWeekdayISO(targetDow){
    var d = new Date();
    var diff = (targetDow - d.getDay() + 7) % 7;
    d.setDate(d.getDate() + diff);
    return localISO(d);
  }
  function parseTrailingDateToken(text){
    var patterns = [
      { re:/\s*today\s*$/i, iso:function(){ return todayISO(); }, label:"Today" },
      { re:/\s*tomorrow\s*$/i, iso:tomorrowISO, label:"Tomorrow" },
      { re:/\s*اليوم\s*$/, iso:function(){ return todayISO(); }, label:"اليوم" },
      { re:/\s*(غداً|غدا)\s*$/, iso:tomorrowISO, label:"غداً" }
    ];
    WEEKDAYS_EN.forEach(function(name, idx){
      patterns.push({ re:new RegExp("\\s*"+name+"\\s*$","i"), iso:function(){ return nextWeekdayISO(idx); }, label:WEEKDAYS_EN_LABEL[idx] });
    });
    WEEKDAYS_AR.forEach(function(name, idx){
      patterns.push({ re:new RegExp("\\s*"+name+"\\s*$"), iso:function(){ return nextWeekdayISO(idx); }, label:name });
    });
    for(var i=0;i<patterns.length;i++){
      var m = text.match(patterns[i].re);
      if(m && m[0].trim().length>0){
        var clean = text.slice(0, text.length - m[0].length);
        if(clean.trim().length===0) continue;
        return { cleanTitle:clean, iso:patterns[i].iso(), label:patterns[i].label, matchedText:m[0] };
      }
    }
    return null;
  }

    if(!s){ row.innerHTML = ""; return; }
    row.innerHTML = '<div class="date-chip-row"><span class="date-chip suggestion">Set date to '+esc(s.label)+'?'
      + '<button type="button" id="c-date-suggest-accept" title="Use this date">&#10003;</button>'
      + '<button type="button" id="c-date-suggest-dismiss" title="Keep as typed">&times;</button></span></div>';
    document.getElementById("c-date-suggest-accept").onclick = function(){
      createDraft.title = s.cleanTitle;
      createDraft.date = s.iso;
      createDraft.dateSuggestion = null;
      createDraft.dismissedSuggestionKey = null;
      buildCreatePanel();
      var t = document.getElementById("c-title");
      if(t){ t.focus(); t.setSelectionRange(t.value.length, t.value.length); }
    };
    document.getElementById("c-date-suggest-dismiss").onclick = function(){
      createDraft.dismissedSuggestionKey = s.matchedText;
      createDraft.dateSuggestion = null;
      renderDateSuggestion();
      var t = document.getElementById("c-title");
      if(t) t.focus();
    };
  }

  function wireCreatePanelEvents(){
    document.getElementById("create-close-btn").onclick = closeCreatePanel;
    document.getElementById("create-cancel-btn").onclick = closeCreatePanel;
    document.getElementById("c-title").addEventListener("input", function(e){
      var val = e.target.value;
      createDraft.title = val;
      var parsed = parseTrailingDateToken(val);
      if(parsed && parsed.matchedText===createDraft.dismissedSuggestionKey){
        createDraft.dateSuggestion = null;
      } else if(parsed){
        createDraft.dateSuggestion = parsed;
        createDraft.dismissedSuggestionKey = null;
      } else {
        createDraft.dateSuggestion = null;
        createDraft.dismissedSuggestionKey = null;
      }
      renderDateSuggestion();
    });
    document.getElementById("c-title").addEventListener("keydown", function(e){
      if(e.key==="Enter" && !e.shiftKey){
        e.preventDefault();
        if(e.metaKey || e.ctrlKey) submitCreate(true); else submitCreate(false);
      }
    });
    var dateClearBtn = document.getElementById("c-date-clear");
    if(dateClearBtn) dateClearBtn.onclick = function(){ createDraft.date = null; buildCreatePanel(); refocusCreateTitle(); };

    document.getElementById("create-panel-content").onclick = function(e){
      if(e.target.closest("#c-new-group-pill")){
        var pillBtn = document.getElementById("c-new-group-pill");
        pillBtn.outerHTML = '<div class="rail-add-form" style="width:100%;">'
          + '<input type="text" id="c-new-group-name" placeholder="Category name" dir="auto">'
          + '<div class="rail-add-form-foot"><button type="button" class="btn-ghost small" id="c-new-group-cancel">Cancel</button><button type="button" class="btn-primary" id="c-new-group-save" style="padding:5px 10px;font-size:12px;">Add</button></div>'
          + '</div>';
        var newInput = document.getElementById("c-new-group-name");
        newInput.focus();
        document.getElementById("c-new-group-cancel").onclick = function(){ buildCreatePanel(); refocusCreateTitle(); };
        var saveNewGroup = function(){
          var name = newInput.value.trim();
          if(!name) return;
          createDraft.groupId = Store.addGroup(name);
          buildCreatePanel();
          refocusCreateTitle();
        };
        document.getElementById("c-new-group-save").onclick = saveNewGroup;
        newInput.addEventListener("keydown", function(ev){ if(ev.key==="Enter"){ ev.preventDefault(); saveNewGroup(); } });
        return;
      }
      var gPill = e.target.closest("[data-c-group]");
      if(gPill){ createDraft.groupId = gPill.getAttribute("data-c-group") || null; buildCreatePanel(); refocusCreateTitle(); return; }
      var pPill = e.target.closest("[data-c-priority]");
      if(pPill){ createDraft.priority = pPill.getAttribute("data-c-priority"); buildCreatePanel(); refocusCreateTitle(); return; }
      var aPick = e.target.closest("[data-c-toggle-assignee]");
      if(aPick){ toggleDraftAssignee(createDraft.assignees, aPick.getAttribute("data-c-toggle-assignee")); buildCreatePanel(); refocusCreateTitle(); return; }
      var baPick = e.target.closest("[data-c-toggle-branch-assignee]");
      if(baPick){
        var parts = baPick.getAttribute("data-c-toggle-branch-assignee").split("|");
        toggleDraftAssignee(createDraft.branches[parseInt(parts[0],10)].assignees, parts[1]);
        buildCreatePanel(); refocusCreateTitle(); return;
      }
      if(e.target.closest("#c-add-branch-btn")){ createDraft.branches.push({title:"", assignees:[]}); buildCreatePanel(); focusLastBranchTitle(); return; }
      var rmBranch = e.target.closest("[data-c-remove-branch]");
      if(rmBranch){ createDraft.branches.splice(parseInt(rmBranch.getAttribute("data-c-remove-branch"),10),1); buildCreatePanel(); refocusCreateTitle(); return; }
    };
    document.getElementById("create-panel-content").addEventListener("input", function(e){
      var bTitle = e.target.closest("[data-c-branch-title]");
      if(bTitle) createDraft.branches[parseInt(bTitle.getAttribute("data-c-branch-title"),10)].title = e.target.value;
    });

    document.getElementById("create-submit-btn").onclick = function(){ submitCreate(false); };
  }

  function submitCreate(keepOpen){
    if(!createDraft.title.trim()){ document.getElementById("c-title").focus(); return; }
    var patch = { title:createDraft.title.trim(), groupId:createDraft.groupId, priority:createDraft.priority, assignees:createDraft.assignees.slice() };
    if(createDraft.date) patch.date = createDraft.date;
    var parent = Store.createItem(patch);
    createDraft.branches.forEach(function(b){
      if(!b.title.trim()) return;
      Store.createItem({ parentId:parent.id, groupId:createDraft.groupId, title:b.title.trim(), priority:createDraft.priority, status:"todo", assignees:b.assignees.slice() });
    });
    renderAll();
    if(keepOpen){
      var groupId = createDraft.groupId;
      createDraft = { title:"", groupId:groupId, priority:"medium", assignees:[], branches:[], date:null, dateSuggestion:null, dismissedSuggestionKey:null };
      buildCreatePanel();
      refocusCreateTitle();
    } else {
      closeCreatePanel();
    }
  }

  function paletteIndex(query){
    var q = query.trim().toLowerCase();
    var results = [];
    var actions = [
      {label:"New to-do", run:function(){ openCreatePanel(); }},
      {label:"Toggle theme", run:function(){ cycleTheme(); }},
      {label:"Go to All", run:function(){ setRail("all"); }},
      {label:"Go to Insights", run:function(){ setRail("overview"); }},
      {label:"Go to Team", run:function(){ setRail("team"); }}
    ];
    actions.forEach(function(a){
      if(!q || a.label.toLowerCase().indexOf(q)!==-1) results.push({type:"action", label:a.label, run:a.run});
    });
    if(q){
      Store.getAllItems().forEach(function(it){
        if(it.title && it.title.toLowerCase().indexOf(q)!==-1){
          results.push({ type:"task", label:it.title, sublabel:it.parentId?"Branch":"To-do", run:function(){ openDetail(it.id); } });
        }
      });
      Store.getGroups().forEach(function(g){
        if(g.name.toLowerCase().indexOf(q)!==-1) results.push({ type:"classification", label:g.name, run:function(){ setRail(g.id); } });
      });
      Store.getStaff().forEach(function(s){
        if(s.name.toLowerCase().indexOf(q)!==-1) results.push({ type:"person", label:s.name, sublabel:s.dept||"", run:function(){ setRail("team"); } });
      });
    }
    return results.slice(0, 30);
  }

  function buildPaletteUI(){
    document.getElementById("palette-content").innerHTML =
      '<input type="text" id="palette-input" placeholder="Search to-dos, people, classifications, or actions...">'
      + '<div id="palette-results"></div>';
    renderPaletteResults("");
    document.getElementById("palette-input").addEventListener("input", function(e){ renderPaletteResults(e.target.value); });
    document.getElementById("palette-input").addEventListener("keydown", function(e){
      var rows = document.querySelectorAll("#palette-results .palette-item");
      if(e.key==="ArrowDown"){ e.preventDefault(); paletteActiveIndex = Math.min(paletteActiveIndex+1, rows.length-1); highlightPaletteActive(); }
      else if(e.key==="ArrowUp"){ e.preventDefault(); paletteActiveIndex = Math.max(paletteActiveIndex-1, 0); highlightPaletteActive(); }
      else if(e.key==="Enter"){ e.preventDefault(); if(paletteActionHandlers[paletteActiveIndex]) runPaletteChoice(paletteActiveIndex); }
    });
  }
  function renderPaletteResults(query){
    paletteActiveIndex = 0;
    var results = paletteIndex(query);
    paletteActionHandlers = results.map(function(r){ return r.run; });
    var html = results.length ? results.map(function(r,i){
      return '<button type="button" class="palette-item'+(i===0?" active":"")+'" data-idx="'+i+'"><span class="palette-item-type">'+esc(r.type)+'</span><span class="palette-item-label" dir="auto">'+esc(r.label)+'</span>'+(r.sublabel?'<span class="palette-item-sub" dir="auto">'+esc(r.sublabel)+'</span>':"")+'</button>';
    }).join("") : '<div class="empty-col" style="padding:20px;">No matches</div>';
    document.getElementById("palette-results").innerHTML = html;
    document.querySelectorAll("#palette-results .palette-item").forEach(function(node, i){
      node.onclick = function(){ runPaletteChoice(i); };
    });
  }
  function highlightPaletteActive(){
    var rows = document.querySelectorAll("#palette-results .palette-item");
    rows.forEach(function(n,i){ n.classList.toggle("active", i===paletteActiveIndex); });
    if(rows[paletteActiveIndex] && rows[paletteActiveIndex].scrollIntoView) rows[paletteActiveIndex].scrollIntoView({block:"nearest"});
  }
  function runPaletteChoice(i){
    var run = paletteActionHandlers[i];
    closePalette();
    if(run) run();
  }
  document.addEventListener("keydown", function(e){
    if((e.metaKey || e.ctrlKey) && (e.key==="k" || e.key==="K")){
      e.preventDefault();

  function startInlineGroupRenameInManage(groupId){
    var row = document.querySelector('.cat-manage-row[data-cat-row="'+groupId+'"]');
    var nameEl = row ? row.querySelector(".cat-manage-name") : null;
    var group = Store.getGroups().filter(function(g){ return g.id===groupId; })[0];
    if(!nameEl || !group) return;
    var input = document.createElement("input");
    input.type = "text"; input.className = "inline-title-edit rail-inline-rename"; input.setAttribute("dir","auto");
    input.value = group.name;
    input.style.flex = "1"; input.style.minWidth = "0";
    nameEl.replaceWith(input);
    input.focus(); input.select();
    var committed = false;
    function commit(){ if(committed) return; committed=true; var v=input.value.trim(); if(v) Store.updateGroup(groupId,{name:v}); renderAll(); }
    function cancel(){ if(committed) return; committed=true; buildCategoriesPanel(); }
    input.addEventListener("keydown", function(ev){
      if(ev.key==="Enter"){ ev.preventDefault(); commit(); }
      else if(ev.key==="Escape"){ ev.preventDefault(); cancel(); }
    });
    input.addEventListener("blur", commit);
    input.addEventListener("click", function(ev){ ev.stopPropagation(); });
  }

    });
    list.querySelectorAll("[data-cat-row]").forEach(function(row){
      row.addEventListener("dragstart", function(e){
        e.dataTransfer.setData("application/x-rail-group", row.getAttribute("data-cat-row"));
        e.dataTransfer.effectAllowed = "move";
        row.classList.add("drag-source");
      });
      row.addEventListener("dragend", function(){ row.classList.remove("drag-source"); });
    });
    list.addEventListener("dragover", function(e){
      var row = e.target.closest("[data-cat-row]");
      if(!row || !dtHasType(e, "application/x-rail-group")) return;
      e.preventDefault();
      row.classList.add("drag-over");
    });
    list.addEventListener("dragleave", function(e){
      var row = e.target.closest("[data-cat-row]");
      if(row) row.classList.remove("drag-over");
    });
    list.addEventListener("drop", function(e){
      var row = e.target.closest("[data-cat-row]");
      if(!row || !dtHasType(e, "application/x-rail-group")) return;
      e.preventDefault();
      row.classList.remove("drag-over");
      var draggedId = e.dataTransfer.getData("application/x-rail-group");
      var targetId = row.getAttribute("data-cat-row");
      if(!draggedId || draggedId===targetId) return;
      var rect = row.getBoundingClientRect();
      var after = (e.clientY - rect.top) > rect.height/2;
      var ids = Store.getGroups().map(function(g){ return g.id; }).filter(function(id){ return id!==draggedId; });
      var targetIdx = ids.indexOf(targetId);
      ids.splice(after ? targetIdx+1 : targetIdx, 0, draggedId);
      Store.reorderGroups(ids);
      renderAll();
    });
  }

    var ImportExport = (function(){
    var STATUS_ALIASES = { "todo":"todo","to do":"todo","backlog":"todo","in progress":"in_progress","in_progress":"in_progress","done":"done","complete":"done","completed":"done" };
    var PRIORITY_ALIASES = { "medium":"medium","med":"medium","high":"high","critical":"critical","urgent":"critical" };
    function normStatus(s){ return STATUS_ALIASES[(s||"").toString().trim().toLowerCase()] || "todo"; }
    function normPriority(s){ return PRIORITY_ALIASES[(s||"").toString().trim().toLowerCase()] || "medium"; }

    function parseAssigneeNames(str){
      if(!str) return [];
      return String(str).split(";").map(function(t){ return t.trim(); }).filter(Boolean).map(function(tok){
        var isLead = tok.charAt(tok.length-1)==="*";
        return { name: isLead?tok.slice(0,-1).trim():tok, isLead:isLead };
      });
    }
    function encodeAssigneeNames(assignees){
      return (assignees||[]).map(function(a){ var s=Store.getStaffById(a.staffId); return (s?s.name:"?")+(a.isLead?"*":""); }).join("; ");
    }

    function indexHeaders(headerRow){
      var map = {};
      (headerRow||[]).forEach(function(h,i){ map[String(h||"").trim().toLowerCase()] = i; });
      return map;
    }

    function rowsToImportRecords(aoa){
      if(!aoa || aoa.length<2) return [];
      var idx = indexHeaders(aoa[0]);
      var col = function(name){ return idx[name]; };
      var out = [];
      for(var r=1;r<aoa.length;r++){
        var row = aoa[r];
        if(!row || row.every(function(c){ return c==null || String(c).trim()===""; })) continue;
        out.push({
          title: col("title")!=null ? String(row[col("title")]||"").trim() : "",
          date: col("date")!=null ? String(row[col("date")]||"").trim() : "",
          groupName: col("group")!=null ? String(row[col("group")]||"").trim() : "",
          assignees: parseAssigneeNames(col("assignees")!=null ? row[col("assignees")] : ""),
          priority: normPriority(col("priority")!=null ? row[col("priority")] : ""),
          status: normStatus(col("status")!=null ? row[col("status")] : ""),
          notes: col("notes")!=null ? String(row[col("notes")]||"") : "",
          parentTitle: col("parent")!=null ? String(row[col("parent")]||"").trim() : ""
        });
      }
      return out;
    }

    function rowsToPeopleRecords(aoa){
      if(!aoa || aoa.length<2) return [];
      var idx = indexHeaders(aoa[0]);
      var col = function(name){ return idx[name]; };
      var out = [];
      for(var r=1;r<aoa.length;r++){
        var row = aoa[r];
        if(!row || row.every(function(c){ return c==null || String(c).trim()===""; })) continue;
        var name = col("name")!=null ? String(row[col("name")]||"").trim() : "";
        if(!name) continue;
        out.push({ name:name, dept: col("department")!=null ? String(row[col("department")]||"").trim() : "" });
      }
      return out;
    }

    function resolveImport(records, base){
      var groups = base.groups.map(function(g){ return {id:g.id,name:g.name}; });
      var staff = base.staff.map(function(s){ return {id:s.id,name:s.name,dept:s.dept}; });
      var items = base.items.map(function(it){ return Object.assign({},it,{assignees:it.assignees.map(function(a){ return Object.assign({},a); })}); });
      var nextGroupNum=base.nextGroupNum, nextStaffNum=base.nextStaffNum, nextItemNum=base.nextItemNum;

      items.forEach(function(it){ if(!it.parentId) titleToId[it.title]=it.id; });

      function findOrCreateGroup(name){
        name=(name||"").trim();
        if(!name) return groups[0]?groups[0].id:null;
        var found = groups.filter(function(g){ return g.name.trim().toLowerCase()===name.toLowerCase(); })[0];
        if(found) return found.id;
        var id="g"+(nextGroupNum++); groups.push({id:id,name:name}); return id;
      }
      function findOrCreateStaff(name){
        name=(name||"").trim();
        if(!name) return null;
        var found = staff.filter(function(s){ return s.name.trim().toLowerCase()===name.toLowerCase(); })[0];
        if(found) return found.id;
        var id="s"+(nextStaffNum++); staff.push({id:id,name:name,dept:""}); return id;
      }

      records.forEach(function(rec){

        if(rec.parentTitle && titleToId[rec.parentTitle]){

          var parentItem = items.filter(function(it){ return it.id===parentId; })[0];
          groupId = parentItem ? parentItem.groupId : findOrCreateGroup(rec.groupName);
        } else {

        }
        var assignees = rec.assignees.map(function(a){ var sid=findOrCreateStaff(a.name); return sid?{staffId:sid,isLead:a.isLead}:null; }).filter(Boolean);
        var item = { id:id, parentId:parentId, groupId:groupId, title:rec.title, date:rec.date, assignees:assignees, priority:rec.priority, status:rec.status, notes:rec.notes };
        items.push(item);
        if(!parentId) titleToId[rec.title]=id;

      return { groups:groups, staff:staff, items:items, nextGroupNum:nextGroupNum, nextStaffNum:nextStaffNum, nextItemNum:nextItemNum };
    }

    function resolvePeopleImport(records, existingStaff, nextStaffNum, mode){

      var num = mode==="append" ? nextStaffNum : 1;

        var found = staff.filter(function(s){ return s.name.trim().toLowerCase()===rec.name.trim().toLowerCase(); })[0];

    function applyImport(records, mode){

        ? "Imported (replaced " + snap.items.length + " item" + (snap.items.length===1?"":"s") + ")"
        : "Imported " + records.length + " row" + (records.length===1?"":"s");
      Store._replaceAll({ groups:result.groups, staff:result.staff, items:result.items, nextGroupId:result.nextGroupNum, nextStaffId:result.nextStaffNum, nextItemId:result.nextItemNum }, label);
    }

    function applyPeopleImport(records, mode){
      var snap = Store._snapshot();
      var result = resolvePeopleImport(records, snap.staff, snap.nextStaffId, mode);
      var validIds = {}; result.staff.forEach(function(s){ validIds[s.id]=true; });
      var items = snap.items.map(function(it){ return Object.assign({}, it, { assignees: it.assignees.filter(function(a){ return validIds[a.staffId]; }) }); });
      var label = mode==="replace"
        ? "Imported people (replaced " + snap.staff.length + " person" + (snap.staff.length===1?"":"s") + ")"
        : "Imported " + records.length + " person" + (records.length===1?"":"s");
      Store._replaceAll({ groups:snap.groups, staff:result.staff, items:items, nextGroupId:snap.nextGroupId, nextStaffId:result.nextStaffNum, nextItemId:snap.nextItemId }, label);
    }

    function exportRows(){
      var rows = [["Title","Date","Group","Assignees","Priority","Status","Notes","Parent"]];
      var groupsById = {}; Store.getGroups().forEach(function(g){ groupsById[g.id]=g.name; });
      Store.getTopLevel().forEach(function(it){
        rows.push([it.title, it.date, groupsById[it.groupId]||"", encodeAssigneeNames(it.assignees), it.priority, STATUS_LABEL[it.status]||it.status, it.notes||"", ""]);
        Store.getChildren(it.id).forEach(function(k){
          rows.push([k.title, k.date, groupsById[it.groupId]||"", encodeAssigneeNames(k.assignees), k.priority, STATUS_LABEL[k.status]||k.status, k.notes||"", it.title]);
        });
      });
      return rows;
    }

    function writeWorkbook(rows, sheetName, filename){
      if(typeof XLSX==="undefined"){ showToast("Couldn't reach the spreadsheet library — check your connection and try again.", "err"); return; }
      var wb = XLSX.utils.book_new();
      var ws = XLSX.utils.aoa_to_sheet(rows);
      XLSX.utils.book_append_sheet(wb, ws, sheetName);
      XLSX.writeFile(wb, filename);
    }

    function exportXlsx(){ writeWorkbook(exportRows(), "Items", "gov-to-do-export.xlsx"); }

    function downloadTemplate(kind){
      if(kind==="people"){
        writeWorkbook([["Name","Department"], ["Sara Ahmed","Finance"]], "People", "gov-to-do-people-template.xlsx");
      } else {
        writeWorkbook([["Title","Date","Group","Assignees","Priority","Status","Notes","Parent"], ["Example task","2026-08-01","Committee","Sara Ahmed*; Ahmed","medium","todo","",""]], "Items", "gov-to-do-todos-template.xlsx");
      }
    }

    function parseFileRaw(file, cb){
      if(typeof XLSX==="undefined"){ cb(new Error("Couldn't reach the spreadsheet library — check your connection and try again.")); return; }
      file.arrayBuffer().then(function(buf){
        try{
          var wb = XLSX.read(new Uint8Array(buf), {type:"array"});
          var sheetName = wb.SheetNames.filter(function(n){ return /items|tasks|people|staff/i.test(n); })[0] || wb.SheetNames[0];
          var ws = wb.Sheets[sheetName];
          var aoa = XLSX.utils.sheet_to_json(ws, {header:1, raw:false});
          cb(null, aoa);
        }catch(err){ cb(err); }
      }).catch(function(err){ cb(err); });
    }

    return {
      parseFileRaw:parseFileRaw, applyImport:applyImport, applyPeopleImport:applyPeopleImport, exportXlsx:exportXlsx, downloadTemplate:downloadTemplate,
      _internal: { rowsToImportRecords:rowsToImportRecords, rowsToPeopleRecords:rowsToPeopleRecords, resolveImport:resolveImport, resolvePeopleImport:resolvePeopleImport, parseAssigneeNames:parseAssigneeNames, encodeAssigneeNames:encodeAssigneeNames, normStatus:normStatus, normPriority:normPriority, exportRows:exportRows }
    };

    if(!tab) return;
    var key = tab.getAttribute("data-rail");
    var isReorder = dtHasType(e, "application/x-rail-group");
    if(isReorder){
      if(key==="all" || key==="overview" || key==="team" || key==="unfiled") return;
    } else if(key==="all" || key==="overview" || key==="team"){
      return;

  document.getElementById("rail-tabs").addEventListener("drop", function(e){
    var tab = e.target.closest('.rail-tab[data-rail]');
    if(!tab) return;
    var key = tab.getAttribute("data-rail");
    tab.classList.remove("drag-over");

    if(dtHasType(e, "application/x-rail-group")){
      if(key==="all" || key==="overview" || key==="team" || key==="unfiled") return;
      e.preventDefault();
      var draggedId = e.dataTransfer.getData("application/x-rail-group");
      if(!draggedId || draggedId===key) return;
      var wrap = tab.closest(".rail-tab-wrap");
      var rect = (wrap||tab).getBoundingClientRect();
      var after = (e.clientY - rect.top) > rect.height/2;
      var ids = Store.getGroups().map(function(g){ return g.id; }).filter(function(id){ return id!==draggedId; });
      var targetIdx = ids.indexOf(key);
      ids.splice(after ? targetIdx+1 : targetIdx, 0, draggedId);
      Store.reorderGroups(ids);
      renderAll();
      return;
    }

    if(key==="all" || key==="overview" || key==="team") return;
    e.preventDefault();
    var itemId = e.dataTransfer.getData("text/plain");
    if(!itemId) return;
    var item = Store.getItem(itemId);
    if(!item) return;
    var groupId = key==="unfiled" ? null : key;
    var group = groupId ? Store.getGroups().filter(function(g){ return g.id===groupId; })[0] : null;
    if(groupId && !group) return;
    Store.updateItem(itemId, {groupId:groupId});
    renderAll();
    showToast('Moved "' + (item.title||"Untitled") + '" to ' + (group?group.name:"Unfiled"));
  });

  }

  document.getElementById("staff-grid").addEventListener("click", function(e){
    if(e.target.closest("#add-staff-btn")){ openAddStaffForm(); return; }
    var rm = e.target.closest("[data-remove-staff]");
    if(rm){
      var name = Store.deleteStaff(rm.getAttribute("data-remove-staff"));
      renderAll();
      showUndoToast("Removed " + name);
    }
  });

  backdropEl.addEventListener("click", function(){ closeDetail(); closeCreatePanel(); closeSyncPanel(); closeImportPanel(); closeCategoriesPanel(); closePalette(); });
  document.addEventListener("keydown", function(e){
    if(e.key==="Escape"){
      if(panelEl.classList.contains("show")) closeDetail();
      if(document.getElementById("create-panel-el").classList.contains("show")) closeCreatePanel();
      if(syncPanelEl.classList.contains("show")) closeSyncPanel();
      if(importPanelEl.classList.contains("show")) closeImportPanel();
      if(categoriesPanelEl.classList.contains("show")) closeCategoriesPanel();
      if(Object.keys(state.selected).length) clearSelection();
    }
  });

    var THEME_KEY = "governance_tracker_theme_v1";
  var THEME_ICONS = {
    auto: '<svg width="14" height="14" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><circle cx="12" cy="12" r="9"/><path d="M12 3a9 9 0 0 0 0 18z" fill="currentColor" stroke="none"/></svg>',
    light: '<svg width="14" height="14" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><circle cx="12" cy="12" r="4.5"/><path d="M12 2v2.5M12 19.5V22M4.2 4.2l1.8 1.8M18 18l1.8 1.8M2 12h2.5M19.5 12H22M4.2 19.8L6 18M18 6l1.8-1.8"/></svg>',
    dark: '<svg width="14" height="14" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><path d="M20 14.5A8.5 8.5 0 1 1 9.5 4a7 7 0 0 0 10.5 10.5z"/></svg>'
  };
  function currentThemeMode(){
    try{ return localStorage.getItem(THEME_KEY) || "auto"; }catch(e){ return "auto"; }
  }
  function applyTheme(mode){
    if(mode==="auto") document.documentElement.removeAttribute("data-theme");
    else document.documentElement.setAttribute("data-theme", mode);
    try{ localStorage.setItem(THEME_KEY, mode); }catch(e){}
    var btn = document.getElementById("theme-toggle-btn");
    if(btn){
      var label = mode==="auto"?"Auto":mode==="light"?"Light":"Dark";
      btn.innerHTML = THEME_ICONS[mode] + "<span>"+label+"</span>";
    }
    renderDataOverviewIfVisible();
  }
  function renderDataOverviewIfVisible(){
    if(state.rail==="overview") renderDataOverview();
  }
  function cycleTheme(){
    var order = ["auto","light","dark"];
    var next = order[(order.indexOf(currentThemeMode())+1) % order.length];
    applyTheme(next);
  }
  document.getElementById("theme-toggle-btn").addEventListener("click", cycleTheme);
  if(window.matchMedia){
    var darkModeQuery = window.matchMedia("(prefers-color-scheme: dark)");
    var onOsThemeChange = function(){ if(currentThemeMode()==="auto") renderDataOverviewIfVisible(); };
    if(darkModeQuery.addEventListener) darkModeQuery.addEventListener("change", onOsThemeChange);
    else if(darkModeQuery.addListener) darkModeQuery.addListener(onOsThemeChange);
  }
  function restoreViewState(){
    var saved = loadViewState();
    if(!saved) return;
    state.rail = saved.rail || "all";
    state.tableFilter = saved.filter || "all";
    document.querySelectorAll(".chip").forEach(function(c){ c.classList.toggle("active", c.getAttribute("data-filter")===state.tableFilter); });
    var isList = (state.rail!=="overview" && state.rail!=="team");
    document.getElementById("pane-list").classList.toggle("active", isList);
    document.getElementById("pane-overview").classList.toggle("active", state.rail==="overview");
    document.getElementById("pane-team").classList.toggle("active", state.rail==="team");
  }

    applyTheme(currentThemeMode());
  Store.init();
  restoreViewState();
  renderAll();

})();
</script>
</body>
</html>
